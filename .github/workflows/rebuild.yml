name: Weekly rebuild

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "games_overrides.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 fetch.py
      - run: python3 extract_games_flat.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      - run: python3 merge_overrides.py
      - run: python3 backfill_games.py
      - run: python3 distinct_games.py
      - run: python3 enrich_games.py
      - run: python3 build.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "weekly rebuild $(date +%Y-%m-%d)"
          git push
