ul>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_3.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /> <b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a>  </p>\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-3/"}, {"title": "GameCritics.com Podcast Episode 2", "episode": 2, "desc": "<p>It's the stunning second episode of the GameCritics.com Podcast! <br />This week's topics include:</p>\n<ul>\n<li>Impressions of <i>Fallout 3</i> and <i>World of Goo</i></li>\n<li>The unknown N64 origin of Gears of War's duck-and-cover gameplay</li>\n<li>Post-Halloween discussion of our favorite scary games</li>\n</ul>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_2.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /> <b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p>Show notes:</p>\n<ul>\n<li><a href=\"/node/1944\">Winback review</a> </li>\n<li><a href=\"/node/3572\">Interview with Winback Producer, Tomoike Takazumi</a></li>\n</ul>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-2/"}, {"title": "GameCritics.com Podcast Episode 1", "episode": 1, "desc": "<p>Welcome to the premiere episode of the GameCritics.com Podcast! <br />This week's topics include:</p>\n<ul>\n<li>Reviews of <i>Saints Row 2</i> and <i>Art Style: Cubello</i></li>\n<li>Why game criticism matters to us</li>\n<li>Can games make us cry?</li>\n</ul>\n\n<p>Download: <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_1.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /> <b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n\n<p>Please send questions for a future mailbag segment to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-1/"}];

let postersVisible = false;

(function initTheme() {
  const t = document.getElementById('theme');
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.classList.add('light');
    t.textContent = '☾ Dark';
  }
  t.onclick = function() {
    document.documentElement.classList.toggle('light');
    const isLight = document.documentElement.classList.contains('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    t.textContent = isLight ? '☾ Dark' : '☀ Light';
  };
})();

const epEls = episodes.map((e, i) => {
  const div = document.createElement('div');
  div.innerHTML = epHTML(e);
  const el = div.firstElementChild;
  el.dataset.index = i;
  el.dataset.episode = e.episode != null ? String(e.episode) : '';
  el.dataset.title = (e.title || '').toLowerCase();
  el.dataset.desc = (e.desc || '').toLowerCase();
  return el;
});
const r = document.getElementById('results');
epEls.forEach(el => r.appendChild(el));

let carlosOnly = false;

document.getElementById('toggle-posters').onclick = function() {
  postersVisible = !postersVisible;
  this.textContent = postersVisible ? 'Hide posters' : 'Show posters';
  document.querySelectorAll('.ep-posters').forEach(p => p.classList.toggle('hidden'));
};

document.getElementById('carlos-toggle').onclick = function() {
  carlosOnly = !carlosOnly;
  this.classList.toggle('active', carlosOnly);
  filter();
};

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hl(t, q) {
  if (!q) return t;
  try { return t.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }
  catch(e) { return t; }
}

function gameList(epNum) {
  const games = episodeGames[String(epNum)];
  if (!games || !games.length) return '';
  return '<ul class="game-list">' + games.map(g => {
    const entry = gamePosters[g];
    const hasSteam = entry && entry.steam_id;
    const name = esc(g);
    if (hasSteam) {
      return '<li class="known"><a href="https://store.steampowered.com/app/' + entry.steam_id + '" target="_blank" rel="noopener">' + name + '<span class="steam-badge">Steam</span></a></li>';
    }
    return '<li>' + name + '</li>';
  }).join('') + '</ul>';
}

function posterGrid(epNum) {
  const games = episodeGames[String(epNum)];
  if (!games || !games.length) return '';
  const imgs = games.map(g => {
    const entry = gamePosters[g];
    let url = entry ? entry.poster : null;
    if (!url && entry && entry.steam_id) {
      url = 'https://shared.akamai.steamstatic.com/steam/apps/' + entry.steam_id + '/capsule_231x87.jpg';
    }
    if (!url) return '';
    const steamLink = entry && entry.steam_id ? 'https://store.steampowered.com/app/' + entry.steam_id : null;
    const img = '<img src="' + esc(url) + '" alt="' + esc(g) + '" loading="lazy">';
    return steamLink ? '<a href="' + steamLink + '" target="_blank" rel="noopener">' + img + '</a>' : img;
  }).filter(s => s).join('');
  if (!imgs) return '';
  return '<div class="ep-posters' + (postersVisible ? '' : ' hidden') + '">' + imgs + '</div>';
}

function epHTML(e) {
  const tid = 'd' + e.url.replace(/[^a-zA-Z0-9]/g, '');
  const title = esc(e.title);
  const epLabel = e.episode ? 'Ep. ' + e.episode : '';
  const desc = e.desc || '';

  return '<div class="ep">'
    + '<div class="ep-main">'
    + '<div class="ep-title"><a href="' + e.url + '" target="_blank">' + title + '</a></div>'
    + '<div class="ep-meta">' + (epLabel ? epLabel + ' · ' : '') + e.date + '</div>'
    + gameList(e.episode)
    + (desc ? '<div id="' + tid + '" class="desc">' + desc + '</div>' : '')
    + (desc ? '<div class="tog" onclick="var d=document.getElementById(\'' + tid + '\');d.classList.toggle(\'vis\');this.textContent=d.classList.contains(\'vis\')?\'▾ Hide description\':\'▸ Show description\'">▸ Show description</div>' : '')
    + '</div>'
    + posterGrid(e.episode)
    + '</div>';
}

function filter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const epNum = document.getElementById('ep-filter').value.trim();
  let count = 0;
  let anyShown = false;

  epEls.forEach(el => {
    let show = true;
    if (q) {
      show = el.dataset.title.includes(q) || el.dataset.desc.includes(q);
    }
    if (show && epNum) {
      show = parseInt(el.dataset.episode) === parseInt(epNum);
    }
    if (show && carlosOnly) {
      show = (el.dataset.title + ' ' + el.dataset.desc).includes('carlos');
    }
    el.style.display = show ? '' : 'none';
    if (show) {
      count++;
      anyShown = true;
      const i = parseInt(el.dataset.index);
      const link = el.querySelector('.ep-title a');
      if (link) {
        link.innerHTML = q ? hl(esc(episodes[i].title), esc(q)) : esc(episodes[i].title);
      }
    }
  });

  document.getElementById('count').textContent = count + ' / ' + episodes.length + ' episodes';

  const nm = document.getElementById('no-match');
  if (!anyShown) {
    if (!nm) {
      const p = document.createElement('p');
      p.id = 'no-match';
      p.style.cssText = 'color:#666;padding:1rem 0';
      p.textContent = 'No matches';
      r.appendChild(p);
    }
  } else if (nm) {
    nm.remove();
  }
}

let filterTimer;
function debounceFilter() {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(filter, 150);
}
document.getElementById('search').addEventListener('input', debounceFilter);
document.getElementById('ep-filter').addEventListener('input', debounceFilter);
filter();
</script>
