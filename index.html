<style>
:root {
  color-scheme: dark;
  --bg: #0d0d0d;
  --fg: #e0e0e0;
  --border: #1f1f1f;
  --link: #70a0ff;
  --muted: #666;
  --accent: #70a0ff;
  --card-bg: #141414;
  --card-hover: #1a1a1a;
  --mark-bg: #554400;
}
.light {
  color-scheme: light;
  --bg: #f5f5f5;
  --fg: #1a1a1a;
  --border: #ddd;
  --link: #1a5cff;
  --muted: #888;
  --accent: #1a5cff;
  --card-bg: #fff;
  --card-hover: #fafafa;
  --mark-bg: #ffe066;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; background: var(--bg); color: var(--fg); line-height: 1.5; }
h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
#theme { background: none; border: 1px solid var(--border); color: var(--fg); cursor: pointer; font-size: 0.8rem; padding: 0.3rem 0.7rem; border-radius: 6px; }
#theme:hover { background: var(--card-bg); }
.search-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
#search { flex: 1; padding: 0.6rem 0.8rem; font-size: 0.95rem; background: var(--card-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; outline: none; }
#search:focus { border-color: var(--accent); }
#ep-filter { width: 100px; padding: 0.6rem; font-size: 0.95rem; background: var(--card-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; outline: none; text-align: center; }
#ep-filter:focus { border-color: var(--accent); }
.controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
#count { color: var(--muted); font-size: 0.85rem; }
#toggle-posters, #carlos-toggle { background: none; border: 1px solid var(--border); color: var(--fg); cursor: pointer; font-size: 0.8rem; padding: 0.3rem 0.7rem; border-radius: 6px; }
#toggle-posters:hover, #carlos-toggle:hover { background: var(--card-bg); }
#carlos-toggle.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.ep { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; padding: 1.25rem; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--border); transition: background 0.15s; }
.ep:hover { background: var(--card-hover); }
.ep-main { flex: 1; min-width: 0; }
.ep-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.2rem; }
.ep-title a { color: var(--fg); text-decoration: none; }
.ep-title a:hover { color: var(--link); }
.ep-meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.6rem; }
.game-list { list-style: none; padding: 0; margin: 0 0 0.4rem 0; columns: 2; column-gap: 1rem; }
.game-list li { font-size: 0.85rem; padding: 0.1rem 0; padding-left: 1em; text-indent: -1em; color: var(--fg); }
.game-list li::before { content: "▸"; color: var(--accent); padding-right: 0.4em; font-size: 0.7em; }
.game-list li.known a { color: var(--fg); text-decoration: none; border-bottom: 1px dotted var(--muted); }
.game-list li.known a:hover { color: var(--link); border-bottom-color: var(--link); }
.game-list li .steam-badge { font-size: 0.65rem; color: var(--muted); margin-left: 0.3rem; }
.desc { font-size: 0.85rem; line-height: 1.6; color: var(--muted); margin-top: 0.5rem; display: none; overflow-wrap: break-word; }
.desc.vis { display: block; }
.desc p { margin: 0.4em 0; }
.desc a { color: var(--link); }
.tog { color: var(--accent); cursor: pointer; font-size: 0.8rem; user-select: none; opacity: 0.7; }
.tog:hover { opacity: 1; }
mark { background: var(--mark-bg); color: inherit; }

.ep-posters { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-content: start; flex-shrink: 0; }
.ep-posters img { width: 110px; height: auto; border-radius: 4px; background: var(--border); display: block; }
.ep-posters.hidden { display: none; }
.ep-posters img[src=""] { display: none; }

.footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); text-align: center; line-height: 1.8; }
.footer a { color: var(--link); }
.footer .github { display: inline-flex; align-items: center; gap: 0.3rem; }

@media (max-width: 700px) {
  .ep { flex-direction: column; gap: 0.75rem; }
  .ep-posters { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
  .ep-posters img { width: 100%; }
  .game-list { columns: 1; }
  body { padding: 1rem; }
}
</style>

<script>
const episodes = [{"title": "So Videogames Episode 487: Cameo", "episode": 487, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">Carlos returns to talk about his new favorite game on top of ranting about a few current events. Topics covered include:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Revolgear Zero<br>High Above<br>The Day I Became a Bird<br>Motorslice<br>Max Payne 1 & 3<br>Saints Row<br>Peppered: An Existential Platformer<br>Mixtape<br>The Artful Escape \u2013 Carlos\u2019 review</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-05-11", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-487-cameo/"}, {"title": "So Videogames Episode 486: Wife Talk", "episode": 486, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos comes aboard to cover a slew of topics including:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Crimson Desert (review)<br>Pragmata (review)<br>Mind\u2019s Eye (DLC)<br>Drill Core<br>TerraTech Legion<br>Diablo 4 (DLC)<br>Way of the Tray<br>Bonnie Bear Saves Frogtime<br>Kristala<br>Stellar Blade<br>Neverness to Everness<br>Robocop: Rogue City</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-05-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-486-wife-talk/"}, {"title": "So Videogames Episode 485: Bloodbath", "episode": 485, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, it\u2019s a bloodbath \u2014 another week where the games on tap fail to connect or leave much of an impression. Titles covered include:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Pragmata<br>Lucky Tower<br>Replaced<br>Gecko Gods<br>Vampire Crawlers<br>Reptilian Rising<br>Cthulhu: The Cosmic Abyss</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2026-04-25", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-485-bloodbath/"}, {"title": "So Videogames Episode 484: Breaking News", "episode": 484, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad goes it alone and covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Let Them Come: Onslaught (review)<br>Let Them Come<br>Absolum<br>The Occultist<br>Lucky Tower<br>Pragmata ..and more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-04-20", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-484-breaking-news/"}, {"title": "So Videogames Episode 483: Fruckin\u2019 Fast", "episode": 483, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">It\u2019s been a wild week! This episode begins with a bonus add-on with two games that Brad and Carlos didn\u2019t have time to cover during their recording. </p>\n\n\n\n<p class=\"wp-block-paragraph\">Then we have an entire FULL episode afterwards, so don\u2019t be thrown by the bonus and you\u2019ll hear their takes on:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Ereban: Shadow Legacy<br>Fame or Folly (demo)<br>Starfield<br>Furi (final score)<br>Crimson Desert<br>Grime II<br>Exit 8<br>ChainStaff<br>Samson<br>Darwin\u2019s Paradox</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-04-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-483-fruckin-fast/"}, {"title": "So Videogames Episode 482: The Move", "episode": 482, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">No guests this week, just Brad! </p>\n\n\n\n<p class=\"wp-block-paragraph\">Games covered include:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Sacred 2: Fallen Angel Remaster<br>Easy Delivery Co.<br>Relooted<br>Hunt the Night<br>Furi</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-04-05", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-482-the-move/"}, {"title": "So Videogames Episode 481: Patchwork", "episode": 481, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad goes solo and covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Sumerian Six<br>Collector\u2019s Cove<br>Trash Goblin<br>Thomas & Friends: Wonders of Sodor<br>Devil Jam<br>Against the Storm</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-03-31", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-481-patchwork/"}, {"title": "So Videogames Episode 480: Tuberculosis", "episode": 480, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Jeremiah returns and the goal of \u2018concise show\u2019 goes out the window as they record a mammoth three-hour chatfest! </p>\n\n\n\n<p class=\"wp-block-paragraph\">Titles covered include:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Darkside Detective: Backside of the Moon (demo)<br>UFO 50<br>Down Among the Dead Men<br>Final Fantasy 14<br>Laysara: Summit Kingdom<br>Grind Survivor<br>Pokopia</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-03-23", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-480-tuberculosis/"}, {"title": "So Videogames Episode 479: Eyes Go Bad", "episode": 479, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos returns and the guys chat about:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Star Trek Voyager: Across the Universe<br>Nioh 3<br>Sumerian Six<br>Resident Evil Requiem<br>Seven Deadly Sins<br>Minishoot\u2019 Adventures<br>Greedfall: The Dying World<br>Pokopia </p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-03-16", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-479-eyes-go-bad/"}, {"title": "So Videogames Ep 478: Journo Why?", "episode": 478, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">The new So Videogames Podcast is up! In episode 478 I cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Soulstone Survivors</p>\n\n\n\n<p class=\"wp-block-paragraph\">Star Trek: Across the Universe</p>\n\n\n\n<p class=\"wp-block-paragraph\">Sumerian Six</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026and before that, a passel of listener Qs!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-03-08", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-478-journo-why/"}, {"title": "So Videogames Episode 477: Today\u2019s Not Your Day, Marlow Briggs", "episode": 477, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos returns to join Brad, and the two guys discuss:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Bylina<br>UFO 50<br>Lost in Space: The First Adventure<br>Resident Evil: Requiem<br>Carmageddon: Rogue Shift</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-03-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-477-todays-not-your-day-marlow-briggs/"}, {"title": "So Videogames Episode 476: Sovereign Syndicate, Death Howl, Showgunners, Vampire Therapist", "episode": 476, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers Soverign Syndicate, Death Howl, Showgunners and Vampire Therapist, along with a few odds and ends happening in the industry.</p>\n\n\n\n<div style=\"font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;\"><a href=\"https://soundcloud.com/user-200756560\" title=\"The So... Videogames! Podcast\" target=\"_blank\" style=\"color: #cccccc; text-decoration: none;\">The So\u2026 Videogames! Podcast</a> \u00b7 <a href=\"https://soundcloud.com/user-200756560/so-videogames-episode-476\" title=\"So Videogames Episode 476 - Sovereign Syndicate, Death Howl, Showgunners, Vampire Therapist\" target=\"_blank\" style=\"color: #cccccc; text-decoration: none;\">So Videogames Episode 476 \u2013 Sovereign Syndicate, Death Howl, Showgunners, Vampire Therapist</a></div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-02-22", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-476-sovereign-syndicate-death-howl-showgunners-vampire-therapist/"}, {"title": "So Videogames Episode 475: Mewgenics, Reanimal, God of War: Sons of Sparta, Centipede Gun, Nioh 3, Lovish, Starless Abyss, High on Life 2", "episode": 475, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode Carlos joins Brad, and the two hosts start with a huge load of housekeeping followed by a passel of games including:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Mewgenics<br>Reanimal<br>God of War: Sons of Sparta<br>Centipede Gun<br>Nioh 3<br>Lovish<br>Starless Abyss<br>High on Life 2</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-02-15", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-475-mewgenics-reanimal-god-of-war-sons-of-sparta-centipede-gun-nioh-3-lovish-starless-abyss-high-on-life-2/"}, {"title": "So Videogames Episode 474: Countless Army, I Hate This Place, Drop Duchy, Oregon Trail", "episode": 474, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This show got dropped WAY later in the week than intended, so it\u2019s a bit of a rush job! That said, Brad still covers four titles: Countless Army, I hate This Place, Drop Duchy and Oregon Trail (2024) before finishing up and prepping for the next episode\u2026 in three days!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-02-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-474-countless-army-i-hate-this-place-drop-duchy-oregon-trail/"}, {"title": "So Videogames Episode 473: Interview with Emeric Thoa of The Game Bakers + Cairn", "episode": 473, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this special episode, Brad talks with Emeric Thoa, Creative Director of The Game Bakers about their recent mountain climbing title, Cairn. Following the interview is the full, scored So Videogames review. </p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-01-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-473-interview-with-emeric-thoa-of-the-game-bakers-cairn/"}, {"title": "So Videogames Episode 472: The Carlos Show", "episode": 472, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode Brad is bound by embargo to hold his tongue and has nothing to share, so Carlos saves the day with a whole slew of titles including:</p>\n\n\n\n<p class=\"wp-block-paragraph\"><br>Dragon Traveler<br>Fallout: New Vegas<br>Arknights Endfied<br>Crystal of Atlan\u2026 And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-01-25", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-472-the-carlos-show/"}, {"title": "So Videogames Episode 471: Star Trek Voyager Across the Universe Demo, Big Hops, Mai: Child of Ages, MIO: Memories in Orbit", "episode": 471, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Star Trek Voyager: Across the Universe (demo)<br>Big Hops<br>Mai: Child of Ages<br>MIO: Memories in Orbit\u2026 And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-01-18", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-471-star-trek-voyager-across-the-universe-demo-big-hops-mai-child-of-ages-mio-memories-in-orbit/"}, {"title": "The So Videogames Podcast Episode 470: Crescent Tower, Baseless, Strange Jigsaws, Baby Steps", "episode": 470, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad is joined by returning guest and former GaymeBar cast member Jeremiah Bratton. The two discuss several varied topics and listener Qs before covering Crescent Tower, Baseless, Strange Jigsaws and Baby Steps.</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-01-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-470-crescent-tower-baseless-strange-jigsaws-baby-steps/"}, {"title": "So Videogames Episode 469: Traveler\u2019s Refrain, Dome Keeper, Avowed, Echoes of the End", "episode": 469, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this first episode of 2026, Brad covers: </p>\n\n\n\n<p class=\"wp-block-paragraph\">Traveler\u2019s Refrain (sort of)</p>\n\n\n\n<p class=\"wp-block-paragraph\">Dome Keeper</p>\n\n\n\n<p class=\"wp-block-paragraph\">Avowed</p>\n\n\n\n<p class=\"wp-block-paragraph\">Echoes of the End\u2026 And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2026-01-05", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-469-travelers-refrain-dome-keeper-avowed-echoes-of-the-end/"}, {"title": "So Videogames Episode 468: GOTY", "episode": 468, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">It\u2019s the biggest show of the year and everyone\u2019s favorite episode \u2014 The So Videogames Top 10 of 2025! </p>\n\n\n\n<p class=\"wp-block-paragraph\">Carlos Rodela joins Brad to count down their individual lists including the best, worst and most surprising titles of the last twelve months!</p>\n\n\n\n<div style=\"font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;\"><a href=\"https://soundcloud.com/user-200756560\" title=\"The So... Videogames! Podcast\" target=\"_blank\" style=\"color: #cccccc; text-decoration: none;\">The So\u2026 Videogames! Podcast</a> \u00b7 <a href=\"https://soundcloud.com/user-200756560/so-videogames-468-goty\" title=\"So Videogames 468 GOTY\" target=\"_blank\" style=\"color: #cccccc; text-decoration: none;\">So Videogames 468 GOTY</a></div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-12-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-468-the-top-10-of-2025/"}, {"title": "THE SO VIDEOGAMES PODCAST                          Episode 467: Night Swarm, Shadow Labyrinth, I Am Future: Cozy Apocalypse Survival, Despelote, Golden Idol Investigations", "episode": 467, "desc": "<p class=\"wp-block-paragraph\"></p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">Heads up! In this episode Brad covers four games that (spoiler!) don\u2019t click with him. It\u2019s a rare all-bummer episode, so if you need a little sunshine with your rain, be warned.\u00a0 </p>\n\n\n\n<p class=\"wp-block-paragraph\">Games covered:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Night Swarm</p>\n\n\n\n<p class=\"wp-block-paragraph\">Shadow Labyrinth</p>\n\n\n\n<p class=\"wp-block-paragraph\">I Am Future: Cozy Apocalypse Survival</p>\n\n\n\n<p class=\"wp-block-paragraph\">Despelote</p>\n\n\n\n<p class=\"wp-block-paragraph\">Golden Idol Investigations     \u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-12-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-467-night-swarm-shadow-labyrinth-i-am-future-cozy-apocalypse-survival-despelote-golden-idol-investigations/"}, {"title": "So Videogames Episode 466: Citizen Sleeper 2, Pacific Drive, Saborus, Demonschool, Skate Story, Morsels, Night Swarm", "episode": 466, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:<br>Citizen Sleeper 2 (SCORED REVIEW)<br>Pacific Drive<br>Saborus<br>Demonschool<br>Skate Story<br>Morsels<br>Night Swarm\u2026 and more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-12-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-466-citizen-sleeper-2-pacific-drive-saborus-demonschool-skate-story-morsels-night-swarm/"}, {"title": "So Videogames Episode 465", "episode": 465, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos Rodela returns to discuss a wide array of stuff, including but not limited to:</p>\n\n\n\n<p class=\"wp-block-paragraph\">-Trails in the Sky: First Chapter<br>-Sektori<br>-Soulframe<br>-Meg\u2019s Monster<br>-Octopath Traveler 0<br>-Citizen Sleeper 2</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-12-06", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-465/"}, {"title": "So Videogames Episode 464: PRE-GOTY", "episode": 464, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad gives a peek behind the GOTY curtain by going through the BIG list of titles that are in the running for 2025\u2019s top ten!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-11-30", "url": "https://gamecritics.com/brad-gallaway/65424/"}, {"title": "So Videogames Episode 463", "episode": 463, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This late-landing episode is a solo joint with Brad covering:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Instruments of Destruction<br>Ultimate Zombie Defense<br>Clover Pit<br>Full Metal Schoolgirl<br>Blood West<br>Silly Polly Beast \u2013 Scored Review !<br>Dispatch \u2013 Scored Review !</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-11-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-463/"}, {"title": "So Videogames Episode 462", "episode": 462, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos returns and we talk about:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Dying Light: The Beast<br>Mind\u2019s Eye<br>Ball x Pit<br>Lumines Arise<br>Arc Raiders<br>Vampire: the Masquerade \u2013 Bloodlines 2<br>Where Winds Meet<br>Instruments of Destruction<br>Outer Worlds 2<br>Deathless: The Hero\u2019s Quest</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-11-15", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-462/"}, {"title": "So Videogames Episode 461", "episode": 461, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad answers a question on accessibility, includes last\u2019s week\u2019s clip that was cut due to embargo reasons, takes a look ahead at the next few shows and then covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Battle Suit Aces<br>Dark Quest 4<br>A Pizza Delivery<br>Kentum<br>Arc Raiders<br>Dying Light: The Beast<br>Windswept</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-11-09", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-461/"}, {"title": "So Videogames Episode 460", "episode": 460, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Jeremiah Bratton (formerly of GaymeBar) returns. We discuss:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Escape From Duckov<br>Pokemon Z-A<br>Space Chef<br>Final Fantasy Tactics<br>Halls of Torment\u2026 And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-11-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-460/"}, {"title": "So Videogames Episode 459", "episode": 459, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Yet Another Zombie Survivors<br>Ball x Pit<br>Spindle<br>Bye, Sweet Carole<br>Ila: Frosty Glide<br>Detective Dotson<br>Bounty Star</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-10-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-459/"}, {"title": "So Videogames Episode 458: Halloweeners", "episode": 458, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">We\u2019re nearing the end of October, so you know what that means! Yep, it\u2019s time for a quick divergence into spooky movie recommendations to celebrate the spookiest season! There\u2019s no major games discussion here, but Carlos Rodela comes aboard to share our (sort-of) top 10s and related tangents! Enjoy!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-10-23", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-458-halloweeners/"}, {"title": "So Videogames Episode 457", "episode": 457, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This week\u2019s episode covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Endoparasitic<br>Strange antiquities<br>Super Mining Mechs<br>Castle of Heart Retold<br>Hades II<br>Yet Another Zombie Survivors<br>Creepy Redneck Dinosaur Mansion 3</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a></p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-10-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-457/"}, {"title": "So Videogames Episode 456", "episode": 456, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this shorter-than-usual episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Strange Antiquities<br>Endoparasitic<br>Xenotilt<br>Femboy Futa House \u2013 HEADS UP, this is an adults-only title. The podcast discussion is not graphic, but since we don\u2019t cover adult titles often, please be aware it\u2019s here and listen responsibly. = )</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-10-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-456/"}, {"title": "So Videogames Episode 455", "episode": 455, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad has a very special guest \u2014 <strong>Jeremiah Bratton</strong>, formerly of the GaymeBar Podcast!</p>\n\n\n\n<p class=\"wp-block-paragraph\">In this mammoth ep the guys reminisce and go off on a dizzying number of tangents before covering titles including, but not limited to:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Ratatan<br>Strange Antiquities<br>Fire Emblem (NES)<br>Hotel Barcelona<br>Borderlands 4<br>Wander Stars</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more! And if you enjoyed Jeremiah\u2019s time on SVG, drop us a line and let us know!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-09-28", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-455/"}, {"title": "So Videogames Episode 454", "episode": 454, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Ritual of Raven<br>Frostpunk 2<br>Metal Eden<br>TMNT Tactical Takedown</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-09-26", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-454/"}, {"title": "So Videogames Episode 453", "episode": 453, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos Rodela makes a return to chat with Brad about all the things! </p>\n\n\n\n<p class=\"wp-block-paragraph\">Between the two of them, they cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Diablo 4</p>\n\n\n\n<p class=\"wp-block-paragraph\">Hollow Knight: Silksong</p>\n\n\n\n<p class=\"wp-block-paragraph\">Discounty -Final Score</p>\n\n\n\n<p class=\"wp-block-paragraph\">Chip \u2018n Clawz vs. the Brainioids</p>\n\n\n\n<p class=\"wp-block-paragraph\">Sword of the Sea</p>\n\n\n\n<p class=\"wp-block-paragraph\">Hell is Us</p>\n\n\n\n<p class=\"wp-block-paragraph\">Daemon x Machina: Titanic Scion</p>\n\n\n\n<p class=\"wp-block-paragraph\">Borderlands 4     \u2026..And more! </p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a>!</p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-09-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-453/"}, {"title": "So Videogames Episode 452", "episode": 452, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Discounty<br>Is This Seat Taken?<br>Grit & Valor<br>Lords of the Fallen 2.0<br>Otherwar<br>Cronos: the New Dawn<br>Hollow Knight: Silksong</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-09-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-452/"}, {"title": "So Videogames Episode 451", "episode": 451, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this rapid-fire episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Discounty<br>Curse Rounds<br>Grit & Valor<br>Is This Seat Taken?<br>Herdling</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Also, heads up that there will be a longer-than-usual period between podcasts. Expect the next one in about a week and a half as Brad puts things on pause for a minute to take care of some non-game stuff.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thanks!!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-08-26", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-451/"}, {"title": "So Videogames Episodes 449 & 450", "episode": 449, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">Brad\u2019s been playing catch-up, so we have TWO episodes this week!</p>\n\n\n\n<p class=\"wp-block-paragraph\">First, Episode 449 where Brad covers Mina the Hollower (demo), Discounty, Hell is Us (demo) and <br>Lords of the Fallen 2.0</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\">*</p>\n\n\n\n<p class=\"wp-block-paragraph\">Then, we also have Episode 450 where Carlos arrives halfway through, delivered by angels from on high. Games covered include: </p>\n\n\n\n<p class=\"wp-block-paragraph\">Lords of the Fallen 2.0<br>One-Eyed Likho (demo)<br>Tiny Bookshop<br>Echoes of the End<br>Mafia: the Old Country<br>Discounty<br>Path of Exile 2</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-08-16", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episodes-449-450/"}, {"title": "So Videogames Episode 448", "episode": 448, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad Covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\"><br>Ludocene Launches!<br>Death Stranding<br>Curious Expediton 2<br>Turbo Kid<br>Discounty (demo)<br>Time Flies<br>Achilles: Survivor \u2014 REVIEW<br>Lords of the Fallen 2.0</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-08-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-448/"}, {"title": "So Videogames Episode 447: The Death Stranding 2 SPOILERCAST", "episode": 447, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">Today\u2019s episode is something a little different! Carlos Rodela is back to chat about every secret, twist and turn in <em>Death Stranding 2</em> \u2014 it\u2019s the spoilercast! </p>\n\n\n\n<p class=\"wp-block-paragraph\">Be warned that once past the opening, the entire game is up for discussion, so please don\u2019t listen to the show if you\u2019re concerned about being spoiled on the story aspects of the game. </p>\n\n\n\n<p class=\"wp-block-paragraph\">The guys also give <em>DS2</em> their final review scores as well \u2014 and they\u2019re probably not what you expect!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-07-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-447-the-death-stranding-2-spoilercast/"}, {"title": "So Videogames Episode 446", "episode": 446, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\ aph\">Centum</p>\n\n\n\n<p class=\"wp-block-paragraph\">Sorry We\u2019re Closed</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-03-20", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-431/"}, {"title": "So Videogames Episode 430", "episode": 430, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">Episode 430 is a special one!</p>\n\n\n\n<p class=\"wp-block-paragraph\">We have not one, but *two* special guests!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Up first, Andy Robertson joins the show to discuss his Ludocene Kickstarter \u2013 there\u2019s still time to chip in! (By the way, we had some minor audio issues during the interview, apologies for the blips!)</p>\n\n\n\n<p class=\"wp-block-paragraph\">Then, after the closing music Brad\u2019s son Whitty jumps in to give his thoughts on Beyond Blue, for Meta Quest 2.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Between those segments, we do have a full slate of offerings including:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Stories from Sol: the Gun-Dog: FULL REVIEW<br>Rogue Waters: FULL REVIEW<br>Break the Loop<br>Luck be a Landlord<br>Cabernet<br>Monster Hunter Wilds</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-03-06", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-430/"}, {"title": "So Videogames Episode 429", "episode": 429, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, former co-host Carlos Rodela returns to check in and chat games with Brad! The pair of \u2019em cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Infinity Nikki<br>Tiny Terry\u2019s Turbo Trip<br>Dreamcore<br>Urban Myth Dissolution Center<br>Eternal Strands<br>Rogue Waters<br>Avowed</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-02-24", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-429/"}, {"title": "So Videogames Episode 428", "episode": 428, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Gears Tactics<br>Vampire Survivors: Adventures<br>Elden Ring: Nightreign<br>Hook<br>Undying<br pisode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Blasphemous 2<br>Red Solstice 2: Survivors<br>The Stone of Madness<br>Citizen Sleeper 2: Starward Vector</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-02-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-426/"}, {"title": "So Videogames Episode 425", "episode": 425, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Blasphemous 2<br>Slitterhead<br>Lonely Mountains: Snow Riders<br>Synduality: Echo of Ada<br>While We Wait Here\u00a0\u00a0 \u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-01-26", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-425/"}, {"title": "So Videogames Episode 424", "episode": 424, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022 episode-423/"}, {"title": "So Videogames Episode 422", "episode": 422, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this impromptu episode, Brad takes it easy before getting the show back up to speed by covering Bloomtown: A Different Story and Star Wars Jedi: Survivor.</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-01-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-422/"}, {"title": "So Videogames Episode 421", "episode": 421, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this post-GOTY episode, Brad covers an insane amount of titles, including:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Helldivers 2<br>Venture to the Vile<br>Pine: a Story of Loss<br>Flint: Treasure of Oblivion<br>Universe for Sale<br>Songs of Silence<br>Unicorn Overlord<br>Beyond Galaxyland<br>Beyond Horizons<br>Shadow Tactics: Aiko\u2019s Choice</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-12-30", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-421/"}, {"title": "So Videogames Episode 420: GOTY", "episode": 420, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this gargantuan year-end episode, Brad closes out 2024 with returning co-host Carlos Rodela!</p>\n\n\n\n<p class=\"wp-block-paragraph\">The two discuss their biggest disappointments, the games that got away and their honorable mentions before listing their individual top 10s.</p>\n\n\n\n<p class=\"wp-block-paragraph\">As a special treat, they close out the show with a slew of listener picks!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-12-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-420-goty/"}, {"title": "So Videogames Episode 419", "episode": 419, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, I cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Miniatures<br>Keeper\u2019s Toll<br>Indiana Jones & the Great Circle<br>Hades<br>Mythwrecked<br>The Thaumaturge</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podca -Gami: Path of the Goddess<br>Bloodless<br>Necro Story<br>Besiege<br>Nano Apostle<br>Neva</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-10-15", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-410/"}, {"title": "So Videogames Episode 409", "episode": 409, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this epic, hard-fought episode, Brad\u2019s dog almost DIES as he covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Astrea: Six-Sided Oracles<br>Metro Quester: Osaka<br>The Plucky Squire<br>Planetiles<br>Kunitsu-Gami: Path of the Goddess</p>\n\n\n\n<p class=\"wp-block-paragraph\">Also covered: listener questions about parenting + gaming and a while pile of movie recommendations!</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2024-10-07", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-409/"}, {"title": "The GameCritics.com Podcast \u2013 Page 2", "episode": null, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2024/08/GC-Logo-1.png\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">Started in 2008 with Tim Spaeth, Chi Kong Lui, Mike Bracken and Brad Gallaway, the original podcast of GameCritics.com ran for seven years and nearly 200 episodes. </p>\n\n\n\n<p class=\"wp-block-paragraph\">The show became inaccessible when the site moved several years ago and broke the episode links, but we\u2019ve had repeated requests since then to bring it back.</p>\n\n\n\n<p class=\"wp-block-paragraph\">To honor those wishes, we\u2019ll (finally!) be listing every episode of the show\u2019s entire run right here on one convenient page in the order that they were released. </p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>EDITOR UPDATE:</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">Below were SUPPOSED to be episodes 31 \u2013 60, and then every other episode posted in increments of 30 on the pages following, but the Content Management System we use to post here at GC is having an issue that we haven\u2019t been able to resolve. As such, we won\u2019t be able to post each episode individually here, but you can find the shows where they\u2019re hosted:</p>\n\n\n\n<p class=\"wp-block-paragraph\"><a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">On Spotify</a> and <a href=\"https://soundcloud.com/user-200756560\">on SoundCloud</a>. You can also find the episodes on any podcast app that you might use, they\u2019re included with the \u201cSo\u2026 Videogames Podcast\u201d feed!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Enjoy!!</p>\n\n\n\n<p class=\"wp-block-paragraph\"><a href=\"https://gamecritics.com/brad-gallaway/the-gamecritics-com-podcast-page/\">Page 1</a> </p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2024-10-06", "url": "https://gamecritics.com/brad-gallaway/the-gamecritics-com-podcast-page-2/"}, {"title": "So Videogames Episode 408", "episode": 408, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Capes<br>Melobot<br>Astrea: Six Sided Oracles<br>Closer the Distance<br>Die Again (demo)<br>Metaphor: ReFantazio (demo)</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-09-28", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-408/"}, {"title": "So Videogames Episode 407", "episode": 407, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:<br> <br>Caravan SandWitch<br>Punch Club 2<br>Would You Call Him A Bad Man?<br>Akimbot<br>Evotinction<br>Keylocker</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments sectio ames Episode 400", "episode": 400, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this anniversary episode \u2014 the big 4-0-0! \u2014 Brad covers the usual smattering of new games, but closes the show with a series of questions from the listeners spanning everything from games to parenting to music\u2026 and more!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Games covered in episode 400:</p>\n\n\n\n<p class=\"wp-block-paragraph\"><br>Dungeons of Hinterberg<br>Mists of Noyah<br>Aero the Acro-Bat<br>The Lullaby of Life<br>Punch Club 2: Fast Forward</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-08-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-400/"}, {"title": "So Videogames Episode 399", "episode": 399, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Grizzly Man<br>Dungeons of Hinterberg<br>Bomber Crew: USAF<br>Deathbound (demo)<br>Arranger<br>TimeMelters<br>Mudrunner: Expeditions<br>Flintlock</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTu ost evil character in videogames means that you\u2019re ignoring a lot of Hard Facts!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Get all this AND MORE in this week\u2019s episode!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2023-03-17", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-328-what-about-marlene/"}, {"title": "So Videogames Ep. 327: Asterisk", "episode": 327, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<ul class=\"wp-block-list\">\n<li>Oni: the Road to be the Mightiest Oni</li>\n\n\n\n<li>Demeo</li>\n\n\n\n<li>Mato: Anomalies</li>\n\n\n\n<li>Caverns of Mars: Recharged</li>\n\n\n\n<li>Bleak Faith: Forsaken</li>\n\n\n\n<li>Romancelvania</li>\n\n\n\n<li>Seven: the Days Long Gone</li>\n\n\n\n<li>Risen</li>\n</ul>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\">ALSO!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Quick correction: in the non-games One More Thing before We Go segment near the end of the show, Carlos mentions a show and incorrectly calls it \u201cTomorrowland\u201d but the correct title is \u201cHello Tomorrow!\u201d.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Just FYI!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id11689176
