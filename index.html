ner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-50-transcript\">Transcript</a></p>\n<p>Links: </p>\n<ul>\n<li><a href=\"http://www.youtube.com/watch?v=tagMnBiCBy0\">RandomRob's Podcast Music</a></li>\n<li><a href=\"/dale-weir/video-first-look-at-dead-islands-debut-trailer\">Dead Island Trailer</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-50-the-state-of-game-criticism-dead-island-mania/"}, {"title": "GameCritics.com Podcast Episode 49: Gaming Tragedies", "episode": 49, "desc": "<p>How many games have fallen short of greatness because of a single, fatal flaw? This week we look at gaming\u2019s most tragic failures. Plus, an actual argument breaks out before your very ears, and our thumbs get a workout in our new segment Thumbs Up/Thumbs Down. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \u201cHeat not Heart\u201d Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_49.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"https://gamecritics.com/tera-kirk/gamecritics-com-podcast-episode-49-transcript\">Transcript</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-49-gaming-tragedies/"}, {"title": "GameCritics.com Podcast Episode 48: The Future of Mobile Gaming", "episode": 48, "desc": "<p>3DS! PSP! Smartphones! Which represents the true future of mobile gaming? Plus: Our most anticipated titles of 2011, and you'll struggle to hold back tears as Richard becomes a man. (NOTE: We recorded this episode before the big PSP2/NGP announcement\u2013you'll marvel at the semi-accuracy of our predictions!) Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"The Timely Producer\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_48.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-48-transcript-0\">Transcript</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-48-the-future-of-mobile-gaming/"}, {"title": "GameCritics.com Podcast Episode 47: Third Annual Holiday Awards Spectacular", "episode": 47, "desc": "<p>Gather round the fire, friends, as we celebrate the year in games\u2013the  good, the bad, the really bad, and everything in between. It's our 3rd  Annual Holiday Awards Spectacular! Plus, Brad's son stops by to share  his best and worst of the year, and we announce the winners of our Game  Credit Giveaway! Featuring Brad Gallaway, Mike Bracken, Richard Naik,  Dan Weissenberger, and Tim \"Counting is Hard\" Spaeth. Happy Holidays to  all our listeners!!</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_47.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-47-transcript\">Transcript</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-47-third-annual-holiday-awards-spectacular/"}, {"title": "GameCritics.com Podcast Episode 46: World of Warcraft: Cataclysm, Epic Dungeon, 2011 Gaming Resolutions", "episode": 46, "desc": "<p>Can 12 million people be wrong? In the case of <i>World of Warcraft</i>, the  answer may be\u2026well, that would be telling. In this episode we break  down <i>Cataclysm</i> and the state of <i>WoW</i>. Plus, the sensational indie  roguelike <i>Epic Dungeon</i>, and gaming resolutions for 2011\u2026ours and  YOURS. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard \"A  Closet Joke Would Be Way Too Easy Here\" Naik, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_46.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-46-transcript\">Transcript</a></p>\n<p>Games discussed: </p>\n<ul>\n<li>World of Warcraft: Cataclysm</li>\n<li><a href=\"/brad-gallaway/epic-dungeon-review\">Epic Dungeon</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-46-world-of-warcraft-cataclysm-epic-dungeon-2011-gaming-resolutions/"}, {"title": "GameCritics.com Podcast Episode 45: How to Write a Game Review, Pigsy\u2019s Perfect Ten", "episode": 45, "desc": "<p>Aspiring game reviewer? Maybe we can help. Chi Kong Lui, Brad Gallaway, and Richard Naik share their best trade secrets. Plus, our take on the best DLC no one's talking about: <i>Enslaved</i>'s \"Pigsy's Perfect Ten.\" Your host is Tim \"Yes, Thanksgiving Was Like Two Weeks Ago\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_45.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-podcast-episode-45-transcript\">Transcript</a></p>\n<p>Games discussed: </p>\n<ul>\n<li><a href=\"/brad-gallaway/enslaved-odyssey-to-the-west-review\">Enslaved: Odyssey to the West</a></li>\n<li><a href=\"/brad-gallaway/enslaved-odyssey-to-the-west-pigsys-perfect-10-review\">Enslaved: Odyssey to the West \u2013 Pigsy's Perfect 10</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-45-how-to-write-a-game-review-pigsys-perfect-ten/"}, {"title": "GameCritics.com Podcast Episode 44: Amnesia, MGS Peace Walker, Alan Wake Redux, Halo: Reach", "episode": 44, "desc": "<p>This week, it's some good old fashioned game talk. <i>Amnesia The Dark Descent</i>! <i>Metal Gear Solid: Peace Walker</i>! <i>Alan Wake</i>! Plus: Games are too buggy, Richard sings (twice), and stay tuned after the credits for some impromptu <i>Halo: Reach</i> chat. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"Let's Grow a Beard Together\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_44.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-44-transcript\">Transcript</a></p>\n<p>Games discussed: </p>\n<ul>\n<li><a href=\"/richard-naik/amnesia-the-dark-descent-review\">Amnesia: The Dark Descent</a></li>\n<li>Metal Gear Solid: Peace Walker</li>\n<li><a href=\"/brad-gallaway/alan-wake-review\">Alan Wake</a></li>\n<li><a href=\"/daniel-weissenberger/halo-reach-review\">Halo: Reach</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-44-amnesia-mgs-peace-walker-alan-wake-redux-halo-reach/"}, {"title": "GameCritics.com Podcast Episode 43: Our Earliest Gaming Memories, and Sweet, Sweet Pinball", "episode": 43, "desc": "<p>Technical difficulties be damned; the show must go on! We salvage a rough night with some casual conversation about our earliest gaming memories, pinball, Mega Man, and more. Featuring Chi Kong Lui, Mike Bracken, Richard Naik, and Tim \"Yeah, I Have Pac-Man, Let's Make Out\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_43.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-43-transcript\">Transcript</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-43-our-earliest-gaming-memories-and-sweet-sweet-pinball/"}, {"title": "GameCritics.com Podcast Episode 42: Deadly Premonition", "episode": 42, "desc": "<p>Deadly Premonition: Shovelware or Game of the Year? We're pretty enamored with it, and we spend the entire show telling you why. We discuss its critical response, its connection to Twin Peaks, the mystique of Francis York Morgan, and why it may feature the best storytelling in the history of games. A NOTE ABOUT SPOILERS: The first half of the show is spoiler-free; the second half is spoiler-packed. We tell you when to stop listening if you want to experience the ending yourself (which you absolutely should). Featuring Brad Gallaway, Dan Weissenberger, Richard Naik, and Tim \"Call Me Tim\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_42.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-podcast-episode-42-transcript\">Transcript</a></p>\n<p>Games discussed: </p>\n<ul>\n<li><a href=\"/sparky-clarkson/deadly-premonition-review\">Deadly Premonition</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-42-deadly-premonition/"}, {"title": "GameCritics.com Podcast Episode 41: Gaming Tragedies, Detail & Immersion, Rockstar Games", "episode": 41, "desc": "<p>We're back and less offensive than ever! Our conversation about detail and immersion becomes an impromptu \"State of Rockstar Games\" debate. Plus: Our personal gaming tragedies; tales of data loss and other disasters. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"The Traitor\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_41.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-41-transcript\">Transcript</a></p>\n<p>Games discussed: </p>\n<ul>\n<li><a href=\"/sparky-clarkson/infinite-space-review\">Infinite Space</a></li>\n<li><a href=\"/brad-gallaway/mass-effect-2-lair-of-the-shadow-broker-review\">Mass Effect 2: Lair of the Shadow Broker</a></li>\n<li><a href=\"/sparky-clarkson/red-dead-redemption-review\">Red Dead Redemption</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-41-gaming-tragedies-detail-immersion-rockstar-games/"}, {"title": "GameCritics.com Podcast Episode 40: In Defense of Too Human and Dynasty Warriors", "episode": 40, "desc": "<p>It's all led up to this. Tim defends <i>Too Human</i>. Chi defends <i>Dynasty Warriors</i>. Who will live? Who will die? Find out in this, the second half of our \"Out Of Our Comfort Zone\" extravaganza. With Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"No Singing This Time\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_40.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-episode-40-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li><a href=\"/brad-gallaway/too-human-review\" title=\"Too Human Review\">Too Human</a></li>\n<li><a href=\"/dynasty-warriors-6-review\" title=\"Dynasty Warriors 6 Review\">Dynasty Warriors 6</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-40-in-defense-of-too-human-and-dynasty-warriors/"}, {"title": "GameCritics.com Podcast Episode 39: The State of Multiplayer", "episode": 39, "desc": "<p>With great passion comes great verbosity. We're splitting this week's jumbo show in half, which means our long awaited Too Human / Dynasty Warriors showdown won't occur until next week. This week, though, we step WAY outside our comfort zone and delve into some multiplayer-only experiences, like Monday Night Combat, Castlevania: Destiny of Harmonicas, Lara Croft and the Guardian of Light, and more. We think we have a pretty good grasp on where multiplayer needs to go from here. Plus! Our Quote of the Week! Tim Sings! Richard Calculates! Oh. the party doesn't stop! Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"Yes, I Said He Sings\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_39.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-episode-39-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li><a href=\"/brad-gallaway/lara-croft-and-the-guardian-of-light-review\" title=\"Lara Croft and the Guardian of Light Review\">Lara Croft and the Guardian of Light</a></li>\n<li>Castlevania: Harmony of Dissonance</li>\n<li><a href=\"/richard-naik/monday-night-combat-review\" title=\"Monday Night Combat Review\">Monday Night Combat</a></li>\n<li>Lineage II</li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-39-the-state-of-multiplayer/"}, {"title": "GameCritics.com Podcast Episode 38: Street Fighter, UFC/MMA, Monday Night Combat and Limbo", "episode": 38, "desc": "<p>Every Limbo boy and girl, all around the Limbo world! Gonna do the Limbo Rock, all around the Limbo clock! Translation: we're talking about Limbo \u2014 listen for the spoiler warning because we're covering it all: the puzzles, the successes and failures of the narrative, and the real meaning of the ending. Plus: Brad enjoys a private tour of Uber Entertainment and Monday Night Combat, Chi gets attacked, and Tim reveals the best use of the podcast ever. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard \"Very Easy\" Naik, and Tim \"Also Very Easy\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_38.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-38-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li><a href=\"/chi-kong-lui/exploring-the-impact-of-ufc-and-mma-on-street-fighter\">Exploring the impact of UFC and MMA on Street Fighter</a></li>\n<li>Limbo</li>\n<li><a href=\"/richard-naik/monday-night-combat-review\" title=\"Monday Night Combat Review\">Monday Night Combat</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-38-street-fighter-ufc-mma-monday-night-combat-and-limbo/"}, {"title": "GameCritics.com Podcast Episode 37: RPGs, Dragon Quest IX, Etrian Odyssey III, Puzzle Quest 2, and DeathSpank", "episode": 37, "desc": "<p>We try our best to keep things positive, but Tim screws it up in the home stretch. The topic is \"New RPG's We (Mostly) Love\" and that means Dragon Quest IX, Etrian Odyssey III, Puzzle Quest 2, and DeathSpank. Guess which one we don't love! Plus we premiere a new segment: \"Quote of the Week.\" With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Spahnk\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_37.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-37-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li>1 vs. 100</li>\n<li>Dragon Quest IX: Sentinels of the Starry Skies</li>\n<li>Etrian Odyssey III</li>\n<li>Puzzle Quest 2</li>\n<li>DeathSpank</li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-37-rpgs-dragon-quest-ix-etrian-odyssey-iii-puzzle-quest-2-and-deathspank/"}, {"title": "GameCritics.com Podcast Episode 36: E3 2010 Wrap-Up, Kinect, Move and 3DS", "episode": 36, "desc": "<p>An E3 wrap-up so enormous, so all-encompassing, we drafted a fifth chair from across the pond to share the load. Sinan Kubba of the <a href=\"http://bigredpotion.thegamereviews.com/\">Big Red Potion podcast</a> joins us as we tear Sony, Nintendo, and Microsoft to shreds. The hate flows freely this week folks; if it gets too depressing jump to the 92-minute mark as we reveal our most anticipated games of the show. It's our longest, most vulgarity-packed podcast ever! Rejoice! Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, the aforementioned Sinan Kubba, and Tim \"Billy Big Bang Blitz\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_36.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-36-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li>Microsoft Kinect</li>\n<li>Sony Move</li>\n<li>Nintendo 3DS</li>\n<li>Epic Mickey</li>\n<li>Project Dust</li>\n<li>Lost in Shadows</li>\n<li>Vanquish</li>\n<li>Kid Icarus</li>\n<li>The Legend of Zelda: Skyward Sword</li>\n<li>Portal 2</li>\n<li>Littlebigplanet 2</li>\n<li>Final Fantasy XIV</li>\n<li>Metal Gear Solid Rising</li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-36-e3-2010-wrap-up-kinect-move-and-3ds/"}, {"title": "GameCritics.com Podcast Episode 35: Super Mario Galaxy 2, Monster Hunter Tri and are modern games better than before?", "episode": 35, "desc": "<p>Did creativity, innovation, and overall quality peak in the 20th century? Or are today's games truly better than ever? We try to free ourselves from the haze of nostalgia and find a definitive answer. Plus: Super Mario Galaxy 2! Monster Hunter Tri! And stay after the credits as we tear apart the Prince of Persia movie and puzzle over Ben Kingsley's resume. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Works Every Time\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_35.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-35-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li>Super Mario Galaxy 2</li>\n<li>Monster Hunter Tri</li>\n<li>Final Fantasy series</li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-35-super-mario-galaxy-2-monster-hunter-tri-and-are-modern-games-better-than-before/"}, {"title": "GameCritics.com Podcast Episode 34: UFC Undisputed 2010, Alan Wake and Listener Mailbag", "episode": 34, "desc": "<p>Chi hits the Vegas Strip to throw down with some of MMA's biggest stars and gets an early look at UFC Undisputed 2010. Brad takes on Alan Wake and in the process enrages the entire Internet\u2026again. And we open up the mailbag to answer your burning questions about game manuals, Final Fantasy XIV, and Microsoft Game Room. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Pitfall is So Worth Three Dollars\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_34.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-34-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li><a href=\"/series/ufc\">UFC Undisputed 2010</a> </li>\n<li><a href=\"/brad-gallaway/alan-wake-review\">Alan Wake </a></li>\n<li>Final Fantasy XIV </li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-34-ufc-undisputed-2010-alan-wake-and-listener-mailbag/"}, {"title": "GameCritics.com Podcast Episode 33: Roger Ebert Again and Games with Great Storytelling", "episode": 33, "desc": "<p>Why do so few video games have truly great stories? We have some suggestions for developers and share some of our favorites. Plus: Roger Ebert breaks our hearts, and Chi and Tim finally have a reason to talk about Wing Commander. Brad is thrilled! Featuring Chi Kong Lui, Brad \"Likely Going To Hell\" Gallaway, Richard Naik, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_33.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/http:/tera-kirk/gamecritics-com-podcast-episode-33-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li><a href=\"/brad-gallaway/dragon-age-origins-review\" title=\"Dragon Age: Origins Review\">Dragon Age: Origins</a> </li>\n<li><a href=\"/portal-review\" title=\"Portal Review\">Portal </a></li>\n<li><a href=\"/bioshock-review\" title=\"Bioshock Review\">BioShock</a> </li>\n<li><a href=\"/series/final-fantasy\">Final Fantasy</a> series </li>\n<li>Wing Commander series </li>\n<li><a href=\"/ico/review\" title=\"ICO Review\">ICO</a> </li>\n<li><a href=\"/series/way-of-the-samurai\">Way of the Samurai</a> series </li>\n<li><a href=\"/node/2078\" title=\"Front Mission 3 Review\">Front Mission 3</a> </li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-33-roger-ebert-again-and-games-with-great-storytelling/"}, {"title": "GameCritics.com Podcast Bonus Episode: Heavy Rain Post-Mortem", "episode": null, "desc": "<p>Our three Heavy Rain critics join Tim for a post-mortem on the game. We don't talk much about the story. Instead we focus on the game's emotional resonance (or lack thereof), its \"fail-less\" structure, the effectiveness of its quicktime events, and its possible legacy in the annals of videogame history. Also, somehow, we mention Shenmue about 20 times. Featuring Richard \"Really\" Naik, Trent Fingland, Dan Weissenberger, Tim Spaeth, and a cat hair mustache.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/Heavy_Rain_Post-Mortem_-_A_GameCritics.com_Podcast_Bonus_Episode.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-bonus-episode-heavy-rain-post-mortem-transcript\">Transcript</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-bonus-episode-heavy-rain-post-mortem/"}, {"title": "GameCritics.com Podcast Episode 32: Lost Planet 2, Final Fantasy XIII and how to keep old franchises fresh", "episode": 32, "desc": "<p>Did you miss us? We missed you. After a tearful reunion, Brad tells us about his trip to see Lost Planet 2, Mike offers his unique take on Final Fantasy XIII (finally!), and we examine the challenges faced by decades-old franchises. With Chi Kong Lui, Brad Gallaway, Mike Bracken, Tim Spaeth, and Tingle.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_32.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-32-transcript\">Transcript</a></p>\n<p>Topics discussed: </p>\n<ul>\n<li>Lost Planet 2 </li>\n<li>Final Fantasy XIII </li>\n<li>Dynasty Warriors: Strikeforce </li>\n<li>The Legend of Zelda </li>\n<li>Shin Megami Tensei\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n</li>\n</ul>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-32-lost-planet-2-final-fantasy-xiii-and-how-to-keep-old-franchises-fresh/"}, {"title": "GameCritics.com Podcast Episode 31: Interview with Game Developers Nathan Fouts and Bryan Jury", "episode": 31, "desc": "<p>We welcome back two of our favorite guests, Nathan Fouts of Mommy's Best Games, and Bryan Jury of Epicenter Studios. They bring us up to speed on what's been happening since their last appearances and talk about their new games, <i>Shoot 1UP</i> and <i>Rock of the Dead</i>. These guys are funny, candid, and filled with pie. With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Bob Costas\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_31.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-31-transcript\">Transcript</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-31-interview-with-game-developers-nathan-fouts-and-bryan-jury/"}, {"title": "GameCritics.com Podcast Episode 30: Mass Effect 2 and Sequels We Love/Hate", "episode": 30, "desc": "<p>Brad's review was just the beginning; we debate the exhilarating highs and inexplicable lows of Mass Effect 2. Plus: Tim quits games, classic sequels we love, and statistics, statistics, statistics. With Chi Kong Lui, Brad Gallaway, Mike \"The Outlier\" Bracken, Richard Naik, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_30.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-30-transcript\">Transcript</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-30-mass-effect-2-and-sequels-we-love-hate/"}, {"title": "GameCritics.com Podcast Episode 29: Divinity II, Star Trek Online beta & Listener Mailbag", "episode": 29, "desc": "<p>We're back! Our first show of 2010 offers looks at Divinity II: Ego Draconis and the Star Trek Online beta. Plus, we answer your letters about adventure games, lazy developers, insta-DLC, and games of the (last) decade. With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Not Roy Scheider\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_29.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-29-transcript\">Transcript</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-29-divinity-ii-star-trek-online-beta-listener-mailbag/"}, {"title": "GameCritics.com Podcast Episode 28: Game of the Year and Best/Worst of 2009", "episode": 28, "desc": "<p>Pour yourself a pitcher of egg nog, fire up a yule log, and join the GameCritics.com family as we reminice about the year that was. We'll reveal our game of the year, and discuss the best and worst 2009 had to offer. Featuring Chi, Brad, Mike, Dave, Dan, Richard, Tim, and a special appearance by one of our favorite listeners, Hargrada. Thanks to everyone for listening; we really do appreciate it. Have a happy and safe New Year's, and we'll see you back here in January.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_28.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-28-transcript\">Transcript</a></p>\n<p><b>Award Categories:</b> </p>\n<ul>\n<li>Surprise (Good) of the Year Award </li>\n<li>WTF of the Year Award </li>\n<li>The \"Brad Gallaway is Single-Handedly Keeping Indie Developers in Business\" Award </li>\n<li>Non-2009 Game of the Year </li>\n<li>Most Disappointing Game of the Year </li>\n<li>The Too Human Award for Inexplicable Excellence </li>\n<li>Developer We'll Miss the Most </li>\n<li>Best Argument for Abandoning Discs </li>\n<li>Most Promising New Franchise </li>\n<li>Nail in the Coffin Award </li>\n<li>The Internet Has No Idea What They're Talking About Award </li>\n<li>Best Argument for Games-as-Art </li>\n<li>The Steaming Pile Award </li>\n<li>2009 Game of the Year </li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-28-game-of-the-year-and-best-worst-of-2009/"}, {"title": "GameCritics.com Podcast Episode 27: What Compels You to Play?", "episode": 27, "desc": "<p>What compels us to spend 25, 40, 50, even 70+ hours on a single game? We think we've figured it out. Join us for conversation about <i>Dragon Age, Assassin's Creed 2, Way of the Samurai 3, Torchlight</i> and <i>Borderlands</i> DLC. With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Yes, I Like Borderlands Now\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_27.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-27-transcript\">Transcript</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/series/dragon-age\">Dragon Age: Origins</a></li>\n<li><a href=\"/series/assassins-creed\">Assassin's Creed (series)</a></li>\n<li><a href=\"/series/hitman\">Hitman (series)</a></li>\n<li><a href=\"/series/way-of-the-samurai\">Way of the Samurai (series)</a></li>\n<li><a href=\"http://en.wikipedia.org/wiki/Law_of_the_West\" target=\"_blank\">Law of the West</a></li>\n<li><a href=\"/series/diablo\">Diablo (series)</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-27-what-compels-you-to-play/"}, {"title": "GameCritics.com Podcast Episode 26: Game Studies, Ludology 101 with Matthew Wiese from Singapore-MIT GAMBIT Game Lab", "episode": 26, "desc": "<p>Bonjour class! Welcome to Ludology 101. Matthew Wiese of the Singapore-MIT GAMBIT Game Lab talks about his work and his experience on the academic side of games. Is ludology as sleep-inducing as it sounds? No sir, and in fact criticism and academia may have more in common than you think. With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth. Happy Thanksgiving to all our listeners!</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_26.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/nerd-heroes\">Nerd Heroes: The Phenomenon of Loser Protagonists in Modern Japanese Games by Matthew Weise</a></li>\n<li><a href=\"http://www.nytimes.com/2004/02/26/technology/circuits/26play.html\" target=\"_blank\">NY Times: Deconstructing the Video Game</a></li>\n<li><a href=\"/resident-evil-code-veronica/review\" target=\"_blank\">Resident Evil Code: Veronica Review by Chi Kong Lui</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-26-game-studies-ludology-101-with-matthew-wiese-from-singapore-mit-gambit-game-lab/"}, {"title": "GameCritics.com Podcast Episode 25: Myths of Game Criticism \u2014 Part 2", "episode": 25, "desc": "<p>We continue debunking The Myths of Game Criticism in the second half of our two-part series. Do we live in constant fear of Twitter putting us out of business? Are games so spectacular now that the average score really is 8 out of 10? Do publishers send strike teams to our homes and force us to change scores? We set the record straight. With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Five Point Scale\" Spaeth.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_25.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-25-transcript\">Transcript</a></p>\n<p><b>For your reference, the eight myths we discuss are:</b></p>\n<ol>\n<li>Critics should be required to finish games before writing a review. </li>\n<li>The goal of a \"proper\" game review should be to inform the reader as to whether they should or should not buy a game. </li>\n<li>Those who write about games are not journalists, rather, should be considered \"enthusiast press\" or simply \"games writer.\" </li>\n<li>There is no difference between a \"review\" and a \"critique\". </li>\n<li>The explosion of blogs, podcasts, and Twitter has rendered formal game reviews obsolete. </li>\n<li>Individual game critics and review sites are under constant, unrelenting pressure from publishers to change scores. </li>\n<li>Game scores are often purposefully tweaked to either generate controversy or avoid it. </li>\n<li>A reader should not need to be familiar with the author of a review in order to derive value from it. </li>\n<li>NINE? There's a ninth myth?! Listen and find out!! </li>\n</ol>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"http://drinkingcoffeecola.blogspot.com/2009/10/call-for-input.html\">Feedback from Brad's Drinking Coffeecola Blog</a></li>\n<li><a href=\"/forums/showthread.php?t=16589\">Feedback from GC Forums</a></li>\n<li><a href=\"/brad-gallaway/borderlands-review\">Borderlands Review</a></li>\n<li><a href=\"/gta3/review2\">GTA 3 Second Opinion</a></li>\n<li><a href=\"/node/3633\">Disaster Report Review</a></li>\n<li><a href=\"http://wiki.ffxiclopedia.org/wiki/Lu_Shang's_Fishing_Rod\">FFFXI: Lu Shang's Fishing Rod</a></li>\n<li><a href=\"http://wow.crafterstome.com/recipe/delicious-chocolate-cake.html\">WoW: Delicious Chocolate Cake Recipe</a></li>\n<li><a href=\"http://gonintendo.com/viewstory.php?id=100066\">GoldenEye 007: Invincibility Cheat</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-25-myths-of-game-criticism-part-2/"}, {"title": "GameCritics.com Podcast Episode 24: Myths of Game Criticism", "episode": 24, "desc": "<p>This week we challenge commonly held assumptions about criticism, writers, review scores, finishing games and much more. So much more, in fact, we had to split the episode in half. Plus, if you're a Borderlands fan, get ready to hate us. Our quick hit is less than flattering. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_24.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-24-transcript\">Transcript</a></p>\n<p><b>For your reference, the eight myths we discuss are:</b></p>\n<ol>\n<li>Critics should be required to finish games before writing a review. </li>\n<li>The goal of a \"proper\" game review should be to inform the reader as to whether they should or should not buy a game. </li>\n<li>Those who write about games are not journalists, rather, should be considered \"enthusiast press\" or simply \"games writer.\" </li>\n<li>There is no difference between a \"review\" and a \"critique\". </li>\n<li>The explosion of blogs, podcasts, and Twitter has rendered formal game reviews obsolete. </li>\n<li>Individual game critics and review sites are under constant, unrelenting pressure from publishers to change scores. </li>\n<li>Game scores are often purposefully tweaked to either generate controversy or avoid it. </li>\n<li>A reader should not need to be familiar with the author of a review in order to derive value from it. </li>\n</ol>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/brad-gallaway/borderlands-review\">Borderlands Review</a></li>\n<li><a href=\"http://en.wikipedia.org/wiki/Red_Faction:_Guerrilla\">Red Faction: Guerrilla</a></li>\n<li><a href=\"/node/1700\">Diablo II</a></li>\n<li><a href=\"/series/god-of-war\">God of War</a></li>\n<li><a href=\"/brad-gallaway/muramasa-the-demon-blade-review\">Muramasa: The Demon Blade Review</a></li>\n<li><a href=\"/brad-gallaway/bionic-commando-review\">Bionic Commando Review</a></li>\n</ul>\n<blockquote><p>X-Play's Guitar Hero: Smash Hits review explanation: </p></blockquote>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-24-myths-of-game-criticism/"}, {"title": "GameCritics.com Podcast Episode 23: Aram Jabbari of Atlus on the Business of Localization, Ratings PR and Demon\u2019s Souls", "episode": 23, "desc": "<p>With <i>Demon's Souls</i> nearing release, it's all things Atlus! We welcome Atlus USA's Manager of PR Aram Jabbari to the show. Localization strategies, digital distribution, aggregate sites, and much more are covered, and we take our best shot at getting you some <i>Persona</i> scoop! The back half of the show brings some of the most in-depth <i>Demon's Souls</i> discussion around. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Tim Spaeth\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_23.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-23-transcript\">Transcript</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/developer-s/atlus\">Atlus</a></li>\n<li><a href=\"/series/shin-megami-tensei\" target=\"_blank\">Shin Megami Tensei series</a></li>\n<li><a href=\"/series/trauma-center\" target=\"_blank\">Trauma Center series</a></li>\n<li><a href=\"/series/kings-field\">King's Field series</a></li>\n<li><a href=\"/brad-gallaway/cubivore-review\">Cubivore</a></li>\n<li><a href=\"/brad-gallaway/demons-souls-review\">Demon's Souls Review</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-23-aram-jabbari-of-atlus-on-the-business-of-localization-ratings-pr-and-demons-souls/"}, {"title": "GameCritics.com Podcast Episode 22: Scribblenauts, Muramasa, and Are games too hard?", "episode": 22, "desc": "<p>Do games need to be easier to attract a wider audience? Or are games too easy as it is? Where did all the hard games go? What role does culture play? Will \"Autoplay\" features reduce frustration or just make gamers lazier than ever? With your help, we attack these questions from all directions. Also: quick hits on <i>Scribblenauts</i> and <i>Muramasa: The Demon Blade</i>. With Chi Kong Lui, Brad Gallaway, and Tim \"If You Lose at Candy Land You're Banished to the Woods\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_22.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-22-transcript\">Transcript</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"http://www.gamasutra.com/php-bin/news_index.php?story=25122\" target=\"_blank\">Gamasutra: Are Games Too Much Like Work? by Lew Pulsipher</a></li>\n<li>Scribblenauts</li>\n<li><a href=\"/brad-gallaway/muramasa-the-demon-blade-review\">Muramasa: The Demon Blade</a></li>\n<li><a href=\"http://hg101.classicgaming.gamespy.com/sorcerian/sorcerian.htm\" target=\"_blank\">Sorcerian</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-22-scribblenauts-muramasa-and-are-games-too-hard/"}, {"title": "GameCritics.com Podcast Episode 21: Jenova Chen of thatgamecompany", "episode": 21, "desc": "<p>Jenova Chen of thatgamecompany (<i>flOw</i>, <i>Flower</i>) is our guest this week, and his journey from Shanghai child to superstar developer was a perfect storm of determination, skill, and a whole lot of luck. You'll hear that story and many more in our jam-packed interview. And yes, he explains his Final Fantastic first name. With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_21.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a><br /> <b>Read:</b> <a href=\"/tera-kirk/gamecritics-com-podcast-episode-21-transcript\">Transcript</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li>Cloud</li>\n<li>flOw</li>\n<li><a href=\"/chi-kong-lui/flower-review\">Flower</a></li>\n<li><a href=\"/chi-kong-lui/final-fantasy-vii-review\">Final Fantasy 7</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-21-jenova-chen-of-thatgamecompany/"}, {"title": "GameCritics.com Podcast Episode 20: Xbox Live Summer of Arcade", "episode": 20, "desc": "<p>Sunshine is for losers! We spent our summer vacation indoors, enjoying the offerings of the Xbox Live Summer of Arcade. Well\u2026\u201denjoying\u201d might be too strong a word. We rundown all five games: <i>Splosion Man, Turtles in Time, Marvel vs. Capcom 2, Trials HD</i>, and <i>Shadow Complex</i>. Plus, Mike and Tim red ring within 12 hours of each other! Believe it! Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_20.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/brad-gallaway/shadow-complex-review\">Shadow Complex</a></li>\n<li><a href=\"/brad-gallaway/splosion-man-review\">Splosion Man</a></li>\n<li><a href=\"/brad-gallaway/trials-hd-review\">Trials HD</a></li>\n<li>Turtles in Time</li>\n<li>Marvel vs. Capcom 2</li>\n</ul>\n\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-20-xbox-live-summer-of-arcade/"}, {"title": "GameCritics.com Podcast Episode 19: Bryan Jury of Epicenter Studios", "episode": 19, "desc": "<p>This week, a candid conversation with Bryan Jury of Epicenter Studios, the team behind the new Wii release <i>Real Heroes: Firefighter</i>. How did a tiny development team with an even tinier budget create one of the summer\u2019s most original games? Why was the Wii their platform of choice? And does Bryan REALLY admit the graphics aren\u2019t very good? I told you \u2014 he\u2019s VERY candid. Our thanks to Bryan Jury for a fantastic interview. With Chi Kong Lui, Brad Gallaway, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_19.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/mike-bracken/call-of-duty-finest-hour-review\">Call of Duty: Finest Hour Review</a></li>\n<li><a href=\"/kids-games-that-dont-suck\">Kids' games that DON'T suck: Critter Round-Up</a></li>\n<li><a href=\"/tim-spaeth/gamecritics-com-podcast-episode-17-fallout-3-point-lookout-mtg-duels-of-the-planeswalkers-the-conduit\">Conduit</a></li>\n<li><a href=\"/interview-with-epicenter-studios\">Interview with Epicenter Studios</a></li>\n</ul>\n\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-19-bryan-jury-of-epicenter-studios/"}, {"title": "GameCritics.com Podcast Episode 18: Wii Hate Nintendo", "episode": 18, "desc": "<p>Have we been too hard on Nintendo? According to your feedback, we have. We take a thoughtful look at the company, it's past, present, and future and offer our definitive stance on The House of Mario. Don't worry, it's not 60 straight minutes of unbridled hate. 56 minutes, maybe. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_18.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/wii\">Nintendo Wii</a></li>\n<li><a href=\"/super-mario-galaxy-review\">Super Mario Galaxy</a></li>\n<li><a href=\"/wiisports\">Wii Sports</a></li>\n<li>EA Sports Active</li>\n<li><a href=\"/series/mario-kart\">Mario Kart</a></li>\n<li><a href=\"/series/metroid\">Metroid</a></li>\n<li><a href=\"/series/the-legend-of-zelda\">The Legend of Zelda</a></li>\n<li><a href=\"/series/animal-crossing\">Animal Crossing</a></li>\n<li><a href=\"/assassins-creed-review\">Assassin's Creed</a></li>\n<li><a href=\"/tim-spaeth/gamecritics-com-podcast-episode-17-fallout-3-point-lookout-mtg-duels-of-the-planeswalkers-the-conduit\">The Conduit</a></li>\n<li><a href=\"/tim-spaeth/gamecritics-com-podcast-episode-16-post-e3-2009-special\">E3 2009</a></li>\n</ul>\n\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-18-wii-hate-nintendo/"}, {"title": "GameCritics.com Podcast Episode 17: Fallout 3 Point Lookout, MtG: Duels of the Planeswalkers, The Conduit", "episode": 17, "desc": "<p>After some quick <i>Transformers: Revenge of the Fallen</i> impressions, the crew takes a deep dive into <i>The Conduit</i>, <i>Fallout 3: Point Lookout</i>, and <i>Magic the Gathering: Duels of the Planeswalkers</i>. It's our first three-way, so be gentle. Featuring Chi Kong Lui, Brad Gallaway, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_17.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/fallout-3\">Fallout 3</a></li>\n<li><a href=\"/fallout-3-point-lookout-review\">Fallout 3: Point Lookout DLC Review</a></li>\n<li>Magic the Gathering: Duels of the Planeswalkers</li>\n<li><a href=\"/series/halo\">Halo</a></li>\n<li><a href=\"/series/perfect-dark\">Perfect Dark</a></li>\n<li>The Conduit</li>\n</ul>\n\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-17-fallout-3-point-lookout-mtg-duels-of-the-planeswalkers-the-conduit/"}, {"title": "GameCritics.com Podcast Episode 16: Post E3 2009 Special", "episode": 16, "desc": "<p>Not even the Wii Vitality Sensor could measure the explosive force of our E3 episode. Press conferences! Motion control! Overpriced handhelds! And of course, games, games, games. It's the Internet's only source for E3 analysis, so of course you won't want to miss it. Featuring \"Big Daddy\" Brad Gallaway, \"Horror Geek\" Mike Bracken, \"Canucklehead\" David Stone, and \"Nicknameless\" Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_16.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-16-post-e3-2009-special/"}, {"title": "GameCritics.com Podcast Episode 15: Project Trico, InFamous, Broken Steel, UFC, Dead Space, XBL Community Games", "episode": 15, "desc": "<p>We're back! With Brad's and Tim's new sons safely extracted, the team reunites to discuss all the games they've been playing during the break:  <i>InFamous, Broken Steel, UFC Undisputed, Dead Space, Trino, CaveIn, Mithra</i> and the <i>Project Trico</i> teaser. With Chi Kong \"North/South\" Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_15.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"http://www.youtube.com/watch?v=xF3fED8EXl4\" target=\"_blank\">Project Trico Trailer</a></li>\n<li>InFamous</li>\n<li>Prototype</li>\n<li><a href=\"/crackdown\">Crackdown</a></li>\n<li><a href=\"/brad-gallaway/fallout-3-broken-steel-review\">Fallout 3: Broken Steel DLC</a></li>\n<li><a href=\"/series/ufc\">UFC 2009: Undisputed</a></li>\n<li><a href=\"/series/dead-space\">Dead Space</a></li>\n<li>XBL Community Games: Trino</li>\n<li>XBL Community Games: CaveIn</li>\n<li>XBL Community Games: Mithra</li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-15-project-trico-infamous-broken-steel-ufc-dead-space-xbl-community-games/"}, {"title": "GameCritics.com Podcast Bonus Episode: What is the Citizen Kane of Video Games?", "episode": null, "desc": "<p>While Tim takes some time off to enjoy his new son, we present our very first bonus episode! In these deleted scenes from Episode 14, you'll hear a great segment on how casual games relate to Heather Chaplin\u2019s GDC rant, and then we try to answer that classic gaming question \u201cWhat is the Citizen Kane of Video Games?\u201d Our answers will shock and amaze you. Featuring Chi Kong Lui, Mike Bracken, David Stone, and the very sleepy Tim Spaeth. </p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Bonus_Episode_1.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/series/gears-of-war\">Gears of War 2</a></li>\n<li>Tetris</li>\n<li><a href=\"https://gamecritics.com/series/xenosaga\">Xenosaga 2</a></li>\n<li><a href=\"/series/metal-gear\">Metal Gear Solid 2: Sons of Liberty</a></li>\n<li>Wing Commander</li>\n<li>Civilization</li>\n</ul>\n\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-bonus-episode-what-is-the-citizen-kane-of-video-games/"}, {"title": "GameCritics.com Podcast Episode 14: OnLive, Co-Op on Resident Evil 5 and Do Game Developers Need to Grow Up?", "episode": 14, "desc": "<p>Is the game industry in a state of arrested development? We present our take on Heather Chaplin's incendiary GDC presentation. Plus, the proliferation of co-op, the viability of OnLive, and lessons learned from <i>Leisure Suit Larry</i>. With Chi Kong Lui, Mike Bracken, David Stone, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_14.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/final-fantasy-11/review\">Final Fantasy 11</a></li>\n<li><a href=\"http://www.onlive.com\">OnLive</a></li>\n<li><a href=\"/series/resident-evil\">Resident Evil 5</a></li>\n<li><a href=\"http://g4tv.com/thefeed/blog/post/694389/GDC-2009-Smartbomb-Author-Heather-Chaplin-Tells-Game-Designers-To-Grow-Up.html\">Heather Chaplin on \"Burned by Friendly Fire: Game Critics Rant\" GDC 2009 Panel</a></li>\n<li><a href=\"/fable\">Fable</a></li>\n<li><a href=\"/series/grand-theft-auto\">Grand Theft Auto: Chinatown Wars</a></li>\n<li><a href=\"/series/madworld\">Madworld</a></li>\n<li><a href=\"/series/gears-of-war\">Gears of War 2</a></li>\n<li><a href=\"/chi-kong-lui/game-for-sex-vol-1\">Leisure Suit Larry</a></li>\n</ul>\n\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-14-onlive-co-op-on-resident-evil-5-and-do-game-developers-need-to-grow-up/"}, {"title": "GameCritics.com Podcast Episode 13: Killzone 2, Game Review Mulligans and Erotic Games", "episode": 13, "desc": "<p><i>Killzone 2</i> has the Playstation fanbase divided; on this week\u2019s show we take our stand. Plus, reviews we\u2019d like to take back, and the sexiest listener e-mail segment ever! With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_13.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Topic and Game References:</b> </p>\n<ul>\n<li><a href=\"/series/killzone\">Killzone 2</a></li>\n<li><a href=\"/series/gears-of-war\">Gears of War</a></li>\n<li><a href=\"/series/halo\">Halo</a></li>\n<li><a href=\"/aquaman/review\">Aquaman: Battle for Atlantis</a></li>\n<li><a href=\"/node/1850\">Ready 2 Rumble Boxing</a></li>\n<li><a href=\"/series/fallout\">Fallout 3</a></li>\n<li><a href=\"/lost-planet/review\">Lost Planet: Extreme Conditions</a></li>\n<li><a href=\"http://www.mobygames.com/game/ninja-golf\">Ninja Golf</a></li>\n<li><a href=\"/ribbit-king\">Ribbit King</a></li>\n<li><a href=\"/node/3594\">Kirby's Dream Course</a></li>\n<li><a href=\"/chi-kong-lui/game-for-sex-vol-1\">Leisure Suit Larry</a></li>\n<li><a href=\"/mass-effect\">Mass Effect</a></li>\n<li><a href=\"http://en.wikipedia.org/wiki/The_Last_Hope\">Star Ocean: The Last Hope</a></li>\n<li><a href=\"/series/onechanbara\">Onechanbara</a></li>\n<li><a href=\"http://www.slate.com/id/2213073\">Rapelay</a></li>\n<li><a href=\"http://en.wikipedia.org/wiki/The_Sims\">The Sims</a></li>\n<li><a href=\"/indigo-prophecy\">Indigo Prophecy</a></li>\n<li><a href=\"/series/fear-effect\">Fear Effect</a></li>\n</ul>\n\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-13-killzone-2-game-review-mulligans-and-erotic-games/"}, {"title": "GameCritics.com Podcast Episode 12: Flower, Second Chances and Used Games", "episode": 12, "desc": "<p>Is your mind on your money? Is your money on your mind? As the world teeters on the brink of an economic apocalypse we tackle an even bigger problem\u2013the price of games! Plus, we give some failed franchises a second chance, and the games as art camp gets some new ammunition with the PS3\u2019s <i>Flower</i>. With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_12.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-12-flower-second-chances-and-used-games/"}, {"title": "GameCritics.com Podcast Episode 11: Nathan Fouts of Mommy\u2019s Best Games", "episode": 11, "desc": "<p>Our guest this week is developer Nathan Fouts of Mommy's Best Games. He's the creator of the Xbox Community Game <i>Weapon of Choice</i>, which we covered several episodes ago\u2013and yes, he calls us out on many of our criticisms. He also talks candidly about the freedom and frustration of Community Games development, what inspired <i>Weapon of Choice</i>, and somehow it culminates into a <i>Devil May Cry 3</i> rant that must not be missed. Our thanks to Nathan for participating! Be sure to visit his website at <a href=\"http://www.mommysbestgames.com\">www.mommysbestgames.com</a>.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_11.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-11-nathan-fouts-of-mommys-best-games/"}, {"title": "GameCritics.com Podcast Episode 10: God Hand, River City Ransom, Streets of Rage 2", "episode": 10, "desc": "<p>When we asked you to pick any game for us to discuss, we certainly didn't expect you to pick <i>God Hand</i>. But you did, so we did. Plus, what makes a critic a critic, <i>Streets of Rage 2</i> (no, that's not a typo), and at long last, Chi Kong Lui on <i>River City Ransom</i>. Warning: This episode contains a revelation that will BLOW YOUR MIND. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_10.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-10-god-hand-river-city-ransom-streets-of-rage-2/"}, {"title": "GameCritics.com Podcast Episode 9", "episode": 9, "desc": "<p>Do you like to shoot things? We do! This week the crew engages in vigorous debate over two new run-and-gun games: <i>Little Red Riding Hood's Zombie BBQ</i> and <i>Weapon of Choice</i>. Find out if 2D shooters still have a place in a 3D world.</p>\n<p>Plus, the premiere of our new segment \"What Do You Think?\" (complete with swanky echo effect) where YOU tell US what you think of <i>Fallout 3: Operation Anchorage</i>, and that\u2026unique\u2026control scheme in the <i>Resident Evil 5</i> demo.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_9.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-9/"}, {"title": "GameCritics.com Podcast Episode 8", "episode": 8, "desc": "<p>We celebrate the new year (four weeks late) by previewing 2009's most (and least) anticipated releases. Plus, we tell you why you need to play the Community Games gem <i>CarneyVale Showtime</i>, and is <i>Midnight Club Los Angeles</i> worth a second look? Don't forget to stay after the show for a little something we call \"GameCritics Unleashed.\"</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_8.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-8/"}, {"title": "GameCritics.com Podcast Episode 7", "episode": 7, "desc": "<p>This week's topics include:</p>\n<ul>\n<li>Reader mailbag</li>\n<li>Impressions/reviews of the <i>Rise of the Argonauts</i> and <i>Far Cry 2</i></li>\n</ul>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_7.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-7/"}, {"title": "GameCritics.com Podcast Episode 6", "episode": 6, "desc": "<p>This week's topics include:</p>\n<ul>\n<li>Impressions/reviews of the <i>Left 4 Dead</i> and <i>Street Fighter 2 HD Remix</i></li>\n<li>The future of games distribution: Physical vs. Digital</li>\n</ul>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics_Podcast_Episode_6.m
