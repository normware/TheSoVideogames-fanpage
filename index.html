ad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Rogue Lords<br>Citizen Sleeper,<br>Eternal Edge +<br>Loot River<br>Thea 2<br>Source of Madness<br>Roundguard<br>Winter Ember<br>My Brother Ate My Pudding!<br>Eiyuden Chronicle Rising<br>Mighty Goose</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-05-15", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-284-a-bite-of-coffee-a-sip-of-food/"}, {"title": "So Videogames Ep. 283: The Weirdcast", "episode": 283, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad discuss:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thymesia demo<br>P3<br>Wildcat Gun Machine<br>Trek to Yomi<br>Rogue Lords<br>ADIOS Amigos<br>Tales of Zestiria<br>Ravenous Devils<br>Echoes of Mana</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-05-08", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-283-the-weirdcast/"}, {"title": "So Videogames Ep. 282", "episode": 282, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">A Street Cat\u2019s Tale<br>Kathy Rain<br>Peglin<br>The Serpent Rogue<br>Sallyface<br>Elden Ring (mostly a wrapup)</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And a bonus segment with Brad\u2019s son Whittaker after the closing music covering:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Hello Neighbor 2 BETA<br>Orbit Industries</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026AND MORE!!!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-05-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-282/"}, {"title": "So Videogames Ep. 281: The Speedcast", "episode": 281, "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad and Carlos both had some pressing real-life schedules to keep, but they didn\u2019t want to cancel the show.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So what did they do? They enabled SPEED MODE!!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Listen to the guys rocket through this week\u2019s content in record time, and they even finished early! They cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Road 96<br>The Last Friend<br>Ghostwire: Tokyo (Visual Novel)<br>Ghostwire: Tokyo (main game)<br>Boreal Tenebrae<br>Samurai Bringer\u2026 And more!!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Also, heads up: the teased content featuring Brad\u2019s son Whitty didn\u2019t make it this week, but we\u2019ll definitely get it on the air in ep. 282.</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-04-23", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-281-the-speedcast/"}, {"title": "So Videogames Ep. 280", "episode": 280, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode Carlos is away, so former co-host Corey Motley steps in to fill his chair.</p>\n<p><strong>FULL DISCLOSURE:</strong> Carlos usually does the editing. So, since he was out of action, Brad had to step in and try to piece things together. This is only the second podcast he\u2019s ever assembled, so please be merciful. ^_^</p>\n<p>With that said, the games covered this time around are:</p>\n<p>Far: Changing Tides<br />\nMind Scanners<br />\nCastlevania Advance Collection<br />\nDeck of Ashes<br />\nThe Last Of Us 2<br />\nRoad 96</p>\n<p>\u2026And more!</p>\n<p>We hope you enjoy the show, and hopefully Carlos will be back next episode with a smoother cut! ; D</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-04-19", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-280/"}, {"title": "So Videogames Ep 279: Sharper Than A Blunt Tack", "episode": 279, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Tunic<br />\nA Memoir Blue<br />\n35MM<br />\nTrek to Yomi<br />\ntERRORbane<br />\nDemon\u2019s Souls<br />\nPrincess Farmer<br />\nElden Ring (wrapup)</p>\n<p>\u2026And more!</p>\n<p><a href=\"https://gamecritics.com/brad-gallaway/dem\u2026-review-10-06-09/\">Link to Brad\u2019s Demon\u2019s Souls Review</a></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-04-10", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-279-sharper-than-a-blunt-tack/"}, {"title": "So Videogames Ep. 278: Git Gud, Git Mad", "episode": 278, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p>Mr. Prepper<br />\nFor the Warp<br />\nSMT 5<br />\nNeurodeck<br />\nWeird West<br />\nCrusader Kings III</p>\n<p>\u2026And more!!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-04-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-278-git-gud-git-mad/"}, {"title": "So Videogames Ep. 277: The Elden Spousecast", "episode": 277, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode Carlos is out on a leave of absence, so his chair is filled by Brad\u2019s wife Gina. The pair discuss:</p>\n<p>Vengeful Heart<br />\nRoyal Frontier<br />\nNeon Abyss<br />\nWeird West</p>\n<p>\u2026And then they wrap the show with a lengthy discussion on Elden Ring.</p>\n<p>It\u2019s the Elden Spousecast!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-277-the-elden-spousecast/"}, {"title": "So Videogames Ep. 276", "episode": 276, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p>RPG Time: Legend of Wright<br />\nRoguebook<br />\nWho Pressed Mute on Uncle Marcus?<br />\nPrison Princess<br />\nShadow Warrior 3<br />\nThe Life and Suffering of Sir Brante<br />\nStranger of Paradise: Final Fantasy Origin</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-19", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-276/"}, {"title": "So Videogames Ep. 275: The Eldencast", "episode": 275, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss <strong>Time Loader</strong> and <strong>Aztech: Forgotten Gods</strong> before deep-diving into the world of <strong>Elden Ring</strong>.</p>\n<p>Elden is the first Souls game that Carlos has sunk time into, and Brad has been a FromSoft fan for 27 years. The two of us are bringing hugely different perspectives on what is sure to be one of the biggest games of the year, and we spend the majority of the show chatting about the bad, and the Tarnished.</p>\n<p><strong>SPOILER WARNING</strong> \u2013 we don\u2019t hold anything back in the Elden Ring segment, so heads up that there may be spoilers of all kinds during the chat. We do give warnings during the show before we start to spill. = )</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-275-the-eldencast/"}, {"title": "So Videogames Ep. 274 \u2013 A Grower, Not A Shower", "episode": 274, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad are joined by the delightful Evelyn Rose Hall (@PixyFreakinStix) of Stegosoft Games (@StegosoftGames) to discuss their indie RPG Rise of the Third Power (@R3Pgame) and other topics.</p>\n<p>Of course, there\u2019s games chat as well. They cover:</p>\n<p>Elex II<br />\nPrimordia<br />\nElden Ring</p>\n<p>\u2026And more!!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-07", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-274-a-grower-not-a-shower/"}, {"title": "So Videogames Ep. 273", "episode": 273, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p><a href=\"https://bit.ly/3JDs5aJ\">E-Win Gaming Chairs</a><br />\nHorizon: Forbidden West<br />\nGem Wizards Tactics<br />\nZombie Rollerz: Pinball Heroes<br />\nElden Ring<br />\nGestuFumaDen: Undying Moon<br />\nBraveland Trilogy</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-273/"}, {"title": "So Videogames Ep. 272", "episode": 272, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Infernax<br />\nLacuna<br />\nRise of the Third Power<br />\nDying Light 2<br />\nRed Ronin<br />\nGrapple Dog<br />\nCyberpunk 2077<br />\nGrim Dawn: Definitive Edition</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-02-18", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-272/"}, {"title": "So Videogames Ep. 271: The Angrycast", "episode": 271, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Dreamscaper<br />\nTux & Fanny<br />\nRise of the Third Power<br />\nScrapnaut<br />\nDraw a Stickman: Epic<br />\nDying Light 2: Stay Human<br />\nTransformers: Battlegrounds</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-02-11", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-271-the-angrycast/"}, {"title": "So Videogames Ep. 270", "episode": 270, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Lake<br />\nGuardian of Lore<br />\nTears of Avia<br />\nCastle Morihisa<br />\nOlliOlli World<br />\nBlood Will Be Spilled<br />\nDying Light 2<br />\nThe Company Man</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-02-06", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-270/"}, {"title": "So Videogames Ep. 269: E for Effort", "episode": 269, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a><br />\nIn this episode, Carlos and Brad discuss:</p>\n<p>Rage<br />\nUltra Age<br />\nVagante<br />\nThe Pedestrian<br />\nBad North<br />\nEternal Radiance<br />\nAnvil: Vault Breakers</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-01-28", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-269-e-for-effort/"}, {"title": "So Videogames Ep. 268: Other People, But Talking About Myself", "episode": 268, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Blackwind<br />\nSNK v Capcom: Card Fighters Clash<br />\nDysmantle<br />\nRainbow 6: Extraction<br />\nNobody Saves the World</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-01-22", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-268-other-people-but-talking-about-myself/"}, {"title": "So Videogames Ep. 267", "episode": 267, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p>Nights of Azure<br />\nArcadia Fallen<br />\nDull Grey<br />\nDeep Rock Galactic<br />\nKena: Bridge of Spirits<br />\nNeon Abyss<br />\nFF12<br />\nLake</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-01-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-267/"}, {"title": "So Videogames Ep. 266", "episode": 266, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos takes a break and Brad\u2019s wife Gina fills in. Please excuse the super-rough edit, this was Brad\u2019s first time ever editing a podcast \u2014 and it shows!!</p>\n<p>Games covered include:</p>\n<p>The Gunk<br />\nDead Cells<br />\nKeyWe<br />\nHermitage: Strange Case Files<br />\nTimelie</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-01-07", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-266/"}, {"title": "So Videogames Ep. 265: Hitting Things, Getting Things", "episode": 265, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Tunnel of Doom<br />\nFor the King<br />\nPawn of the Dead<br />\nRecord of Lodoss War: Deedlit<br />\nKeyWe<br />\nBiomutant<br />\nWarhammer 40K: Battlesector<br />\nOne Hand Clapping</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-31", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-265-hitting-things-getting-things/"}, {"title": "So Videogames Ep. 264: GOTY 2021", "episode": 264, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>It\u2019s that time again!</p>\n<p>Carlos & Brad deliver their annual year-end wrapup show covering their respective top 10 picks for the year, a host of awards, and listener picks/pans.</p>\n<p>Strap in, folks \u2014 we guarantee that our lists are gonna surprise you!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-22", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-264-goty-2021/"}, {"title": "So Videogames Ep. 263", "episode": 263, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode Carlos & Brad are prepping for the 2021 GOTY show coming next week, so they take a semi-break and play a bunch of demos from the current Microsoft Xbox Indie Winter Demo-Fest Thing.</p>\n<p>Enjoy this demo talk and grab them from the Xbox store(they\u2019re up until Dec 21!) and then send in your top 3 games of 2021 and 1 terrible one, whether it was just straight-up bad, a disappointment, or anything along those lines.</p>\n<p>We\u2019ll read your pick and give you a shout on the show next week!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-18", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-263/"}, {"title": "So Videogames Ep. 262: All That Remains", "episode": 262, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Apologies in advance \u2014 in Ep. 262, Brad\u2019s PC crashed during recording. Unfortunately, most of the show was lost and unable to be recovered. However, we carried on and made the most of what was left.</p>\n<p>It\u2019s probably the shortest show So Videogames has ever recorded and it\u2019s just a shadow of its former self, but we didn\u2019t want to skip a week and let our faithful listeners down!!</p>\n<p>Covered (BRIEFLY!!!) on this week\u2019s show:</p>\n<p>Halo Infinite<br />\nLoop Hero<br />\nShovel Knight Puzzle Dungeon<br />\nThe last Oricru (demo)<br />\nDate Night Bowling<br />\nAluna: Sentinel of the Shards<br />\nHeavenly Bodies<br />\nNobody Saves the World<br />\nSolar Ash</p>\n<p>\u2026And there was more, but it\u2019s gone. >_></p>\n<p>We\u2019ll be back to a regular, crash-free show next week!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-262-all-that-remains/"}, {"title": "So Videogames Ep. 261", "episode": 261, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss\u2026</p>\n<p>Deathloop<br />\nLego Builder\u2019s Journey<br />\nIn My Shadow<br />\nThe Good Life<br />\nGrow: Song of the Evertree<br />\nWhere Cards Fall<br />\nLost in Random<br />\nChorus<br />\nCarve<br />\nPlaydate<br />\nCursed Golf</p>\n<p>AND they\u2019re joined by special guest Kinsey Burke, an old podcast buddy now working at Chuhai Labs!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-261/"}, {"title": "So Videogames Ep. 260: Carlos Shoots Good", "episode": 260, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p>DEEEER Simulator<br />\nUndungeon<br />\nSheepo<br />\nRadiohead Exhibition<br />\nOutriders<br />\nNext Space Rebels<br />\nExo One<br />\nFC6: Vaas DLC<br />\nThe Last Stand: Aftermath</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n<p style=\"text-align: center;\"><strong>If you\u2019d like to listen in a different place:</strong></p>\n<p style=\"text-align: center;\">Spotify: <u><a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq</a></u></p>\n<p style=\"text-align: center;\">iTunes: <u><a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623</a></u></p>", "date": "2021-11-26", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-260-carlos-shoots-good/"}, {"title": "So Videogames Ep. 259", "episode": 259, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>The Kids We Were<br />\nLittle Bug<br />\nLucid Cycle<br />\nPixel Heroes: Mega Byte & Magic<br />\nToem<br />\nThe Forgotten City<br />\nGuardians of the Galaxy</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-11-20", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-259/"}, {"title": "So Videogames Ep. 258: New Jank City", "episode": 258, "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos and Brad discuss:</p>\n<p>Stilstand<br />\nAeon Drive<br />\nAirborne Kingdom<br />\nForza Horizons 5<br />\nRiftbreaker<br />\nSuper Hiking League DX<br />\nGuardians of the Galaxy<br />\nJars,<br />\nCirca Infinity<br />\nGTA: Definitive Edition</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-11-13", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-258-new-jank-city/"}, {"title": "So Videogames Ep. 257: F*ck Dave Chappelle", "episode": 257, "desc": "<p><a href=\"https://gamecriti n\n<hr>", "date": "2020-04-08", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-2020-reunion/"}, {"title": "GameCritics.com Podcast Episode 157: ReCore and Keiji Inafune\u2019s No Good Very Bad year", "episode": 157, "desc": "<p><a href=\"/wp-content/uploads/2016/04/podcast-logo-1.jpg\"></a></p>\n<p>Another one on one show as Richard Naik and Mike \u201cpermanently screw yourself into a hole\u201d Suskie discuss the (de)merits of ReCore and the collapse of Keiji Inafune\u2019s reputation. Also, if you have not played Metroid Prime, please do so. You\u2019ll thank us. Also also, here is <a href=\"https://www.youtube.com/watch?v=A_2Z1YNnz0M&feature=youtu.be\" target=\"_blank\">the video</a> Mike references around the 20 minute mark.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode157.mp3\" target=\"_blank\">Right click here and select \u201cSave Target As\u2026\u201d</a><br />\n<b>Subscribe:</b> <a href=\"https://itunes.apple.com/us/podcast/gamecritics.com-podcast/id295924839?mt=2\" target=\"_blank\">iTunes</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "2016-10-16", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-episode-157-recore-and-keiji-inafunes-no-good-very-bad-year/"}, {"title": "GameCritics.com Podcast Episode 156: Overwatch, Multiplayer, and Impostors", "episode": 156, "desc": "<p><a href=\"/wp-content/uploads/2016/04/podcast-logo-1.jpg\"></a></p>\n<p>Another two-man affair as grizzled multiplayer veteran Richard Naik talks with Brad Gallaway about Overwatch, the game that finally made him question his stance on hating fun of all kinds. Also a few words about the GameCritics impostor, who is still pretending to be us in an attempt to get free download codes from publishers.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode156.mp3\" target=\"_blank\">Right click here and select \u201cSave Target As\u2026\u201d</a><br />\n<b>Subscribe:</b> <a href=\"https://itunes.apple.com/us/podcast/gamecritics.com-podcast/id295924839?mt=2\" target=\"_blank\">iTunes</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "2016-09-18", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-episode-156-overwatch-multiplayer-and-impostors/"}, {"title": "GameCritics.com Podcast Episode 155: Mankind United: An Intimate Evening with Richard and Corey", "episode": 155, "desc": "<p><a href=\"/wp-content/uploads/2016/04/podcast-logo-1.jpg\"></a></p>\n<p>A romantic two-man affair as Richard and Corey chat about Deus Ex: Mankind Divided, pulling away from social media, and bad television.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode155.mp3\" target=\"_blank\">Right click here and select \u201cSave Target As\u2026\u201d</a><br />\n<b>Subscribe:</b> <a href=\"https://itunes.apple.com/us/podcast/gamecritics.com-podcast/id295924839?mt=2\" target=\"_blank\">iTunes</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "2016-09-03", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-episode-155-mankind-united-an-intimate-evening-with-richard-and-corey/"}, {"title": "GameCritics.com Podcast Episode 154: Pokemon Go, No Man\u2019s Sky, and Star Trek", "episode": 154, "desc": "<p><a href=\"/wp-content/uploads/2016/04/podcast-logo-1.jpg\"></a></p>\n<p>We\u2019re back, a mere 12 years after our last show. No Man\u2019s Sky, Inside, Pokemon Go, Mighty Number Nine, The Fall, and We Happy Few, plus Star Trek Beyond, social media malaise, and a deep dive into Richard\u2019s digestive system. Featuring Chi Kong Lui, Richard Naik, Corey Motley, and Tim Spaeth.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode154.mp3\" target=\"_blank\">Right click here and select \u201cSave Target As\u2026\u201d</a><br />\n<b>Subscribe:</b> <a href=\"https://itunes.apple.com/us/podcast/gamecritics.com-podcast/id295924839?mt=2\" target=\"_blank\">iTunes</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "2016-08-15", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podast-episode-154-pokemon-go-no-mans-sky-and-star-trek/"}, {"title": "GameCritics.com Podcast Episode 153: E3 Spectacular", "episode": 153, "desc": "<p><a href=\"/wp-content/uploads/2016/04/podcast-logo-1.jpg\"></a></p>\n<p>From Kratos to Zelda, from Neo to Scorpio, and from LeVar Burton to the Ends of the Earth, it\u2019s our annual roundup of gaming\u2019s biggest week. E3! What more could you possibly need to know? Featuring Chi Kong Lui, Brad Gallaway, Richard Naik, Corey Motley, and Tim \u201cGauntlet Schmauntlet\u201d Spaeth.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode153.mp3\" target=\"_blank\">Right click here and select \u201cSave Target As\u2026\u201d</a><br />\n<b>Subscribe:</b> <a href=\"https://itunes.apple.com/us/podcast/gamecritics.com-podcast/id295924839?mt=2\" target=\"_blank\">iTunes</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "2016-06-23", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-153-e3-spectacular/"}, {"title": "GameCritics.com Podcast Episode 152: Overwatch Playcast", "episode": 152, "desc": "<p><a href=\"/wp-content/uploads/2016/04/podcast-logo-1.jpg\"></a></p>\n<p>LIVE from the Internet, it\u2019s the first ever GameCritics playcast! Richard and Suskie join forces to debate the merits of Blizzard\u2019s latest powerhouse and to talk about how great Team Fortress 2 was/is.</p>\n<p align=\"center\"></p>\n<p><b>Subscribe:</b> <a href=\"https://itunes.apple.com/us/podcast/gamecritics.com-podcast/id295924839?mt=2\" target=\"_blank\">iTunes</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "2016-06-15", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-episode-152-overwatch-playcast/"}, {"title": "GameCritics.com Podcast Episode 151: Sequels and a New Beginning", "episode": 151, "desc": "<p><a href=\"/wp-content/uploads/2016/04/podcast-logo-1.jpg\"></a></p>\n<p>We\u2019d like to tell you about our favorite sequels of all time. Won\u2019t you join us? Plus exclusive behind-the-scenes tales of the GameCritics website relaunch! Oooh, juicy! Starring Chi Kong Lui, Brad Gallaway, Richard Naik, Richard Naik\u2019s Respiratory System, and Tim Spaeth.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode151.mp3\" target=\"_blank\">Right click here and select \u201cSave Target As\u2026\u201d</a><br />\n<b>Subscribe:</b> <a href=\"https://itunes.apple.com/us/podcast/gamecritics.com-podcast/id295924839?mt=2\" target=\"_blank\">iTunes</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "2016-06-05", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-151-sequels-and-a-new-beginning/"}, {"title": "GameCritics.com Podcast Episode 150: Dark Souls 3 and Mirror\u2019s Edge Catalyst Demo", "episode": 150, "desc": "<p><a href=\"/wp-content/uploads/2016/04/podcast-logo-1.jpg\"></a></p>\n<p>For episode 150 we turn to the final entry in the Souls series, at least until it\u2019s rebooted. We delve into major Dark Souls 3 spoilers around the 17 minute mark, so you have been warned. Also, brief chitchat about Mirror\u2019s Edge Catalyst demo, Salt & Sanctuary, and making fun of the WiiU. Featuring Richard Naik, Brad Gallaway, Mike Suskie, and Ashley King.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode150.mp3\" target=\"_blank\">Right click here and select \u201cSave Target As\u2026\u201d</a><br />\n<b>Subscribe:</b> <a href=\"https://itunes.apple.com/us/podcast/gamecritics.com-podcast/id295924839?mt=2\" target=\"_blank\">iTunes</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "2016-04-27", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-episode-150-dark-souls-3-and-mirrors-edge-catalyst-demo/"}, {"title": "Gamecritics.com Podcast Episode 81: Scary Games and The Walking Dead: Episode 4", "episode": 81, "desc": "<p><br /><br /><br /></p>\n<p>This week, we discuss our favorite scary games, and then have a mega discussion of <i>The Walking Dead: Episode 4</i>! With Chi Kong Lui, Brad Gallaway, Richard \u201cDefender Against The Robot Uprising\u201d Naik, Dylan Collins and special guest Jeffrey Matulef.</p>\n\n\n<div style=\"font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;\"><a href=\"http 00:00-00:02 \u2013 Intros </p>\n<p>00:02-00:12 \u2013 A little chat about our musical backgrounds </p>\n<p>00:12-00:27 \u2013 Games that we hate, but love the music</p>\n<p>00:28-00:48 \u2013 With the technological evolutions over the years, has game music lost something compared to it's restricted roots? </p>\n<p>00:49-01:04 \u2013 Name something creative that a game has done with its music that drastically altered your opinion of said game</p>\n<p>01:05-01:31 \u2013 Some of our personal favorite game songs/soundtracks</p>\n<p>01:31-close \u2013 Thumbs </p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode101.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p> <!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\">    </div>", "date": "", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-episode-101-video-game-music/"}, {"title": "GameCritics.com Podcast Episode 100: The Centennial", "episode": 100, "desc": "<p>Sinan Kubba is joined by the full house of Brad Gallaway, Chi Kong Lui, Mike Bracken, and Richard \"Ouya\" Naik to celebrate a historic fixture in the history of the GameCritics.com podcast: The grand return of the Horror Geek. Oh, and 100 episodes of a podcast that's been like a pair of tattooed knuckles, offering both love and hate for all things gaming.. Yes, one knuckle's been slightly bigger than the other. Okay, not slightly.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href= Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-episode-89-a-fallout-sojourn/"}, {"title": "GameCritics.com Podcast Episode 88: A New Era, Monster Hunter, and Broken Games", "episode": 88, "desc": "<p>Where one story ends\u2013sorry <i>Aliens: Colonial Marines Wii U</i>\u2013another begins anew. Welcome to the new, but pretty damn familiar GameCritics.com podcast with brand new co-host Sinan Kubba of Joystiq\u2013yes, co-host\u2013more details inside\u2026  Join Sinan and regular ruffians Mike Bracken, Richard Naik, Chi Kong Lui, and Brad \"The Guy You Know\" Gallaway as they summarize GDC and PAX East in two seconds, explore the depth of <i>Monster Hunter 3 Ultimate</i>, sink to the depths of <i>Aliens: Colonial Marines</i>, and fathom how the growing prevalence of broken-at-launch games is hurting the industry. All this and more in a GameCritics.com podcast episode that will rewrite history, woo-oo.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/gamecritics88.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/sinan-kubba/gamecritics-com-podcast-episode-88-a-new-era-monster-hunter-and-broken-games/"}, {"title": "GameCritics.com Podcast Episode 87: An Important Announcement and Sell Richard a 3DS", "episode": 87, "desc":  "Gamecritics.com Podcast Episode 80: System Sellers?", "episode": 80, "desc": "<p><BR><BR><BR></p>\n<p>Have you ever bought a system for one game? That's the question we discuss this episode. We also hear about Brad's trip to the Retro Games Expo, and talk about <i>Torchlight 2</i>, <i>Kid Icarus: Uprising</i>, <i>Tokyo Jungle</i> and more. Also, Richard contemplates putting on water skiis. With Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard \"Shark Man\" Naik, and Dylan Collins</p>\n<p align=\"center\">  </p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode80.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/dylan-collins/gamecritics-com-podcast-episode-80-system-sellers/"}, {"title": "Gamecritics.com Podcast Special Team Fortress 2 Extravaganza", "episode": null, "desc": "<p><BR></p>\n<p align=\"center\"></p>\n<p>A few weeks ago I had a bunch of wine and thought to myself: \"Self, what would it be like to get the podcast crew together to play <i>TF2</i>'s Mann Vs Machine?\" Sadly I couldn't get the whole crew on board, but I did manage to get 4 people who had barely played the game before, plus me being terrible at medic and great at healing spies.  Unfortunately we weren't able to finish the round due to technical difficulties and the fact that it was getting so late, but fun was had by all (I think) and let it be known that I actually got Tim Spaeth interested in <i>Team Fortress</i>. Yay me. Enjoy the good times with myself, Chi \"Heavy\" Kong Lui, Tim \"Welcome to the Jungle\" Spaeth, Kristen \"Self-destruct\" Taylor, and Jeremy \"Technical Difficulties\" LaMont.  </p>\n<p>Screenames:<BR>Dr. Penguin \u2013 Richard Naik<BR>gamecritics \u2013 Chi Kong Lui<BR>ColonelT \u2013 Tim Spaeth<BR>Gelles \u2013 Kristen Taylor<BR>Jeremy \u2013 Jeremy LaMont</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/richard-naik/gamecritics-com-podcast-special-team-fortress-2-extravaganza/"}, {"title": "Gamecritics.com Podcast Episode 79: PAX and The Walking Dead Episode Three", "episode": 79, "desc": "<p><BR><BR><BR></p>\n<p>In this episode, Brad is freshly back from PAX Prime and gives us the low-down on what he saw there. We then go into a huge, spoiler-ridden discussion of <i>The Walking Dead Episode Three</i>. Don't worry, we tell you before we start talking about it. Stop being paranoid.  With Chi Kong \"Mr. C\" Lui, Brad \"Richie\" Gallaway, Mike \"Potsie\" Bracken, Richard \"The Fonz\" Naik and Dylan \"Arnold\" Collins.</p>\n<p align=\"center\">  </p>\n<p><b>Download:</b> <a target=\"_blank\" href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcastEpisode79.mp3\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a target=\"_blank\" href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\">iTunes</a> | <a target=\"_blank\" href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\">Zune</a> | <a target=\"_blank\" href=\"http://feeds.feedburner.com/gamecriticspodcast\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/dylan-collins/gamecritics-com-podcast-episode-79-pax-and-the-walking-dead-episode-three/"}, {"title": "GameCritics.com Podcast Episode 75: E3 2012 and Violence in Video Games", "episode": 75, "desc": "<p>It\u2019s our E3 spectacular! We talk about the conferences, we talk about the games and we talk about the Wii U! Plus, with all of the recent controversy over violence in video games, as the industry finally gone too far? With Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik and Dylan \u201cI still haven\u2019t got the hang of this ending thing\u201d Collins.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCriticsPodcast75.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/dylan-collins/gamecritics-com-podcast-episode-75-e3-2012-and-violence-in-video-games/"}, {"title": "GameCritics.com Podcast Episode 74: Dragon\u2019s Dogma, Max Payne 3 and Portable Gaming", "episode": 74, "desc": "<p>On this episode we examine the state of Portable Games. Brad also brings <i>Dragon's Dogma</i> to the table, and Mike and Chi weigh in on <i>Max Payne 3</i>. This episode also features what is surely the greatest Thumbs up, thumbs down of all time! With Dylan Collins, Chi Kong Lui, Brad \"Bromance\" Gallaway, Mike Bracken and special guest Michael Cunningham.</p>\n<p align=\"center\"></p>\n<p><b>Download:</b> <a target=\"_blank\" href=\"http dition Episode", "episode": null, "desc": "<p>After an exhaustive search that spanned multiple continents and an interview process that involved chainsaw-filled cage matches and a perilous journey through shark-infested jungles, we found our man from the depths of the Interwebs and his name is Dylan Collins. Dylan \u201cNot-Tim-Spaeth\u201d Collins joins Chi Kong Lui, Mike Bracken, Richard Naik and Brad Gallaway for the first time in his inaugural audition episode that kicks off a new era of the GC Podcast.</p>\n\n<p><b>Download:</b> <a href=\"http://traffic.libsyn.com/ctpodcast/GameCritics.com_Podcast_Audition_Dylan.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/dylan-collins/gamecritics-com-podcast-dylan-collins-audition-episode/"}, {"title": "GameCritics.com Podcast Episode 70: Goodbye Tim, The Old Republic, Mass Effect 3 Demo, Final Fantasy XIII-2", "episode": 70, "desc": "<p>Keep a tissue at the ready as we bid Tim a fond farewell. But before he takes his final bow, we explore the light and dark sides of BioWare with <i>Star Wars: The Old Republic</i> and the <i>Mass Effect 3</i> demo. Plus The Horror Geek tackles <i>Final Fantasy XIII-2</i>; surely it can't be worse than its predecessor\u2026 or can it? Featuring Tim \"Yup, I put my name first\" Spaeth, Chi Kong Lui, Brad Gallaway, Mike Bracken, and Richard Naik.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_70.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a></p>\n<p><b>Fan tribute to Tim by aHei\u2026</b></p>\n<p align=\"center\"> </p>\n<p><b>Fan tribute to Tim by <a href=\"http://twitter.com/nightdreamer\" title=\"@Nightdreamer\" target=\"_blank\">Nightdreamer</a>\u2026</b></p>\n<p align=\"center\"> </p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-70-goodbye-tim-the-old-republic-mass-effect-3-demo-final-fantasy-xiii-2/"}, {"title": "GameCritics.com Podcast Episode 69: The War on Used Games, Topic Suggestions We Ignored", "episode": 69, "desc": "<p>Used games, gender uncertainty, ignoring player feedback, invigorating cutscenes, Transformers shopping advice, Kirk vs. Picard\u2013All that and much, much, MUCH more on the surprisingly wholesome 69th episode of the GameCritics.com Podcast. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard \"Thumb Integrity Means Nothing to Me\" Naik, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_69.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-69-the-war-on-used-games-topic-suggestions-we-ignored/"}, {"title": "GameCritics.com Podcast Episode 68: Rayman Origins, X-Men Destiny, games writing for free", "episode": 68, "desc": "<p>Surely we can't find anything negative to say about <i>Rayman Origins</i>, right? Errrrr\u2026. Plus the truly uncanny <i>X-Men Destiny</i> (why hast though forsaken me, Denis Dyack?) and our take on whether games journalists should ever write for free. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"Quack\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_68.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-68-rayman-origins-x-men-destiny-games-writing-for-free/"}, {"title": "GameCritics.com Podcast Seeking New Host", "episode": null, "desc": "<p>    So you wanna host a podcast?</p>\n<p>At the end of <a href=\"/tim-spaeth/gamecritics-com-podcast-episode-67-new-years-resolutions-skyward-sword-and-winter-break-games\">episode 67</a>, the announcement was made that after more than three years and what <em>will </em>be 70 amazing episodes, <strong>the GameCritics Podcast is losing our inspirational host and guiding light, Timothy J. Spaeth </strong></p>\n<p>While he will live on in our hearts (and live on in general) he will be missed.</p>\n<p>However, the show isn't over. As is often  said, the end of one thing marks the beginning of the next, and that  holds true here as well. </p>\n<p><strong>GameCritics.com is now in search of a new host</strong> to take up the reins and lead our established cast of Mike, Chi, Richard and Brad in a new direction.</p>\n<p>Have you been a podcast host in the past and need a new show to call home?  </p>\n<p>If not\u2026 are you someone who's always dreamed of hosting a podcast?  </p>\n<p>If not\u2026 do you <em>at least</em> speak English and want to talk on the Internet? </p>\n<p>If the answer to any of those  questions is \u2018YES', you're a fan of the show/familiar with our format,  and you're willing to commit to making podcast magic twice a month, then  we want to talk to you \u2013 And by the way, a Scottish accent is a plus! </p>\n<p>If you think you've got what it  takes to become the next host of the GameCritics podcast (or would like to guest host several episodes in the interim), send an audio  clip or a link to your past work. If you're a first-timer and don't have  any past work, then send us a clip and show us what you've got. <strong>All sample submission (no more than 10 megs) and/or links should be emailed to</strong> <strong>Podcast AT GameCritics Dot Com.</strong> Candidates will be contacted by GameCritics staff. </p>\n<p>Opportunities like this don't come  along every day, and this chance won't be available forever. Drop us a  line, tell us who you are, and who knows\u2026 <b>*you*</b> could be the new emcee  of the world-renowned, fan favorite GameCritics podcast! </p>\n<p><i>Thanks to Brad Gallaway for drafting this announcement.</i></p>", "date": "", "url": "https://gamecritics.com/chi-kong-lui/gamecritics-com-podcast-seeking-new-host/"}, {"title": "GameCritics.com Podcast Episode 67: New Year\u2019s Resolutions, Skyward Sword and Winter Break Games", "episode": 67, "desc": "<p>Happy New Year! We reveal the success rate of our 2011 gaming resolutions, and set some new ones for 2012. Plus, <i>Fallout</i> (the first one!), <i>Infinity Blade II</i>, <i>Sequence</i>, <i>Darksiders</i>, and <i>The Legend of Zelda: Skyward BORED</i>\u2013am I right, people? With Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"My Wife Really Did Say That\" Spaeth. Oh, and I almost forgot! This is the show that changes everything.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_67.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/richard-naik/the-legend-of-zelda-skyward-sword-review\"><i>The Legend of Zelda: Skyward Sword</i> Review</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-67-new-years-resolutions-skyward-sword-and-winter-break-games/"}, {"title": "GameCritics.com Podcast Episode 66: 2011 Awards Spectacular", "episode": 66, "desc": "<p>Fifteen awards, six podcasters, and countless surprises. You'll be stunned by our pick for Game of the Year, and by the vigorous debate that follows its reveal. Plus: we announce the two winners of our Holiday Contest! Thanks to everyone for entering! With Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, Daniel Weissenberger, and Tim \"Maybe Next Year\" Spaeth. From all of us at GameCritics, have a fantastic holiday, and we'll see you in 2012!</p>\n\n<p><b>Download:</b> <a target=\"_blank\" href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_66.mp3\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a target=\"_blank\" href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\">iTunes</a> | <a target=\"_blank\" href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\">Zune</a> | <a target=\"_blank\" href=\"http://feeds.feedburner.com/gamecriticspodcast\">RSS</a> </p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-66-2011-awards-spectacular/"}, {"title": "GameCritics.com Podcast Episode 65: Batman Arkham City, Zelda Skyward Sword, More Skyrim, Corpse Party, Fate/Extra", "episode": 65, "desc": "<p>Brad's back with a vengeance, smacking down accusations that he's playing <i>The Elder Scrolls V: Skyrim</i> incorrectly. Also: <i>The Legend of Zelda: Skyward Sword</i>, <i>Corpse Party</i>, <i>Fate/Extra</i>, and, at last, our semi-epic fight over <i>Batman: Arkham City</i>. Plus: Details on how you can win BIG in our BIG holiday contest. With Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"BIG\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_65.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/richard-naik/batman-arkham-city-review\"><i>Batman: Arkham City</i> Review</a></li>\n<li><a href=\"/guest-critic/corpse-party-review\"><i>Corpse Party</i> Review</a></li>\n<li><a href=\"/brad-gallaway/fate-extra-review\"><i>Fate/Extra</i> Review</a></li>\n<li><a href=\"/richard-naik/the-elder-scrolls-v-skyrim-review\"><i>The Elder Scrolls V: Skyrim</i> Review</a></li>\n<li><a href=\"/mike-bracken/the-elder-scrolls-v-skyrim-second-opinion\"><i>The Elder Scrolls V: Skyrim</i> Second Opinion</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>\n<p><!-- BEGIN: Google Ad code --> </p>\n<div align=\"center\"> <br />\n  </div>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-65-batman-arkham-city-zelda-skyward-sword-more-skyrim-corpse-party-fate-extra/"}, {"title": "GameCritics.com Podcast Episode 64: Skyrim, Assassin\u2019s Creed, Reviewing Multiplayer", "episode": 64, "desc": "<p>Not everybody's thankful for <i>Skyrim</i> this week, but most of us are. We explore this latest epic entry in <i>The Elder Scrolls</i> quintology. Plus, what the heck is Ubisoft doing with <i>Assassin's Creed</i>? (Beats us.) And is it ever OK to ignore multiplayer modes when reviewing games? We think so, and we'll tell you why. Many thanks to our very special guest, the brilliant Rhea Monique! With Chi Kong Lui, Mike Bracken, Richard \"Bob Dylan\" Naik, Tim Spaeth, and Tim Spaeth again as the mysterious and enigmatic J. Bradford Gallaway IV.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_64.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-64-skyrim-assassins-creed-reviewing-multiplayer/"}, {"title": "GameCritics.com Podcast Episode 63: Scott Jones, Uncharted 3, Making Time for Games", "episode": 63, "desc": "<p>We're joined by Reviews on the Run host (and GameCritics alum) Scott Jones, who speaks publicly for the first time about his controversial <i>Uncharted 3</i> review. Afterward, Chi and Mike take a Crater Lake-deep dive into the successes and failures of the game. Plus: Is gameplay an endangered species, and how on Earth do we find the time to play all these video games? With Chi Kong Lui, Mike Bracken, Richard Naik, and Tim \"Deepak\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_63.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/chi-kong-lui/uncharted-3-drakes-deception-review\"><i>Uncharted 3: Drake's Deception</i> Review</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-63-scott-jones-uncharted-3-making-time-for-games/"}, {"title": "GameCritics.com Podcast Episode 62: Anniversaries, Horror Indies, A Return to Dead Island", "episode": 62, "desc": "<p>We celebrate our podcast\u2019s third anniversary by ruminating on some historic game franchise anniversaries; which did we vote as most important? Plus, why Dead Island deserves a second look, and The Horror Geek addresses \u201c6 out of 5\u201d as only he can. With Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \u201cNo Batman For You\u201d Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_62.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/daniel-weissenberger/dead-island-review\"><i>Dead Island</i> Review</a></li>\n<li><a href=\"/brad-gallaway/dead-island-second-opinion\"><i>Dead Island</i> Second Opinion</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-62-anniversaries-horror-indies-a-return-to-dead-island/"}, {"title": "GameCritics.com Podcast Episode 61: Dark Souls, Gaming Confessions", "episode": 61, "desc": "<p><i>Dark Souls</i>. Need I type more? Plus: Our most embarrassing gaming confessions, and indie hits <i>Wizorb</i> and <i>Robotriot</i>. Featuring Chi Kong \"Not Sure Where These Quotes Go\" Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_61.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/guest-critic/dark-souls-review\"><i>Dark Souls</i> Review</a></li>\n<li><a href=\"/brad-gallaway/demons-souls-review\"><i>Demon's Souls</i> Review</a></li>\n<li><a href=\"/guest-critic/demons-souls-second-opinion\"><i>Demon's Souls</i> Second Opinion</a></li>\n<li><a href=\"/kristin-renee-taylor/dark-souls-vs-skyrim\"><i>Dark Souls</i> vs <i>Skyrim</i></a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-61-dark-souls-gaming-confessions/"}, {"title": "GameCritics.com Podcast Episode 60: Deus Ex: HR, Gears of War 3, Dream HD Remakes", "episode": 60, "desc": "<p>This week: The moderate highs and not-so-moderate lows of <i>Deus Ex: Human Revolution</i>, plus we remember what made the original so special. Also: <i>Gears of War 3</i>, Tim takes five minutes off, and we share our picks for dream HD remakes. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard \"The Logician\" Naik, and Tim Spaeth. Special thanks to RandomRob for composing this week's break music!</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_60.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/steve-haske/deus-ex-human-revolution-review\"><i>Deus Ex: Human Revolution</i> Review</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-60-deus-ex-hr-gears-of-war-3-dream-hd-remakes/"}, {"title": "GameCritics.com Podcast Episode 59: PAX Prime 2011", "episode": 59, "desc": "<p>Writer Jeffrey Matulef joins us as we reminisce about our time at PAX Prime 2011. Not only did we get our hands on <i>Lollipop Chainsaw</i>, <i>Aliens: Infestation</i>, the PS Vita, and (of course) <i>Borderlands 2</i>,  but you'll find out what happened when Brad let Richard interact with  his son. No children were harmed in the production of this podcast. As  far as we know. Featuring Brad Gallaway, Mike Bracken, Richard Naik, and  Tim \"Two Balls\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_59.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/brad-gallaway/pax-prime-2011-report-day-one\">Brad's PAX Prime 2011 Report: Day One</a></li>\n<li><a href=\"/brad-gallaway/pax-prime-2011-report-day-two\">Brad's PAX Prime 2011 Report: Day Two</a></li>\n<li><a href=\"/brad-gallaway/brads-pax-prime-2011-report-day-three-ps-vita-capcom\">Brad's PAX Prime 2011 Report: Day Three\u2013PS Vita, Capcom</a></li>\n<li><a href=\"/richard-naik/richards-pax-2011-report-day-one\">Richard's PAX Prime 2011 Report: Day One</a></li>\n<li><a href=\"/richard-naik/richards-pax-prime-2011-report-day-two\">Richard's PAX Prime 2011 Report: Day Two</a></li>\n<li><a href=\"/richard-naik/richards-pax-prime-2011-report-day-three\">Richard's PAX Prime 2011 Report: Day Three</a></li>\n<li><a href=\"/brad-gallaway/pax-prime-2011-prototype-2-preview\">PAX Prime 2011: Prototype 2 Preview</a></li>\n</ul>\n<p align=\"center\"></p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-59-pax-prime-2011/"}, {"title": "GameCritics.com Podcast Episode 58: Gaming with Kids, Catherine", "episode": 58, "desc": "<p>Gamer moms and gamer dads, assemble! The mighty Aaron of the GameEnthus Podcast joins us for a lengthy conversation about the joys and challenges of integrating our parenting and gaming lives. How did we introduce games to our kids? How do we deal with M-rated content? How do we decide when to take the controller away? We also offer some unique kid's game recommendations you won't find anywhere else. Plus: Our take on a game your kids should definitely NOT play: <i>Catherine</i>. With Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"The Master Thespian\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_58.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-58-gaming-with-kids-catherine/"}, {"title": "GameCritics.com Podcast Episode 57: The Games of Our Summer Vacation", "episode": 57, "desc": "<p>The crew reunites and wastes no time getting back to doing what they do best: angering the Internet with a brutal dismantling of <i>Bastion</i>. Plus: Sexism in <i>Ms. 'Splosion Man</i>, the failures of <i>L.A. Noire</i>, the joys of  <i>Ghost Recon 3DS</i>, and the magnificence of <i>Lost Odyssey</i>. We also debut our new movie segment, and if you like surprises, well, hold onto your wigs and keys, folks. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, and Tim \"Fresh Beatz\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_57.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/brad-gallaway/ms-splosion-man-review\">Ms. 'Splosion Man Review</a></li>\n<li><a href=\"/daniel-weissenberger/l-a-noire-review\">L.A. Noire Review</a></li>\n<li><a href=\"/brad-gallaway/bastion-review\">Bastion Review</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-57-the-games-of-our-summer-vacation/"}, {"title": "GameCritics.com Podcast Episode 56: E3 2011", "episode": 56, "desc": "<p>GameCritics' own Trent Fingland regales us with war stories from the E3 front. Along the way we reconcile our E3 predictions, debate the future of Japanese gaming, have a serious talk about religion, and get uncomfortably inquisitive about the whereabouts of Ken Levine. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \u201cDeath to Handhelds\u201d Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_56.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/trent-fingland/e3-2011-day-the-first\">Trent Fingland's E3 Coverage</a></li>\n<li><a href=\"/brandon-bales/e3-2011-explodorama-part-one-0\">Brandon Bales' E3 Coverage</a></li>\n<li><a href=\"/peter-skerritt/consoleation-the-e3-experience-day-one\">Peter Skerritt's E3 Coverage</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-56-e3-2011/"}, {"title": "GameCritics.com Podcast Episode 55: Great Indie Games, E3 2011 Predictions", "episode": 55, "desc": "<p>This week, we honor the little guy. (Not Herve Villechaize; for that, check out my Fantasy Island podcast.) No, it\u2019s all about great Indie Games we think you should play. Plus: Highly improbable E3 predictions which, knowing us, will probably wind up coming true. Featuring Chi Kong Lui, Brad \u201cThe Diamond\u201d Gallaway, Richard Naik, and Tim Spaeth. Happy birthday Ryan!</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_55.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-55-great-indie-games-e3-2011-predictions/"}, {"title": "GameCritics.com Podcast Episode 54: The Games That Made Us, Hypothetical Pre-Orders", "episode": 54, "desc": "<p>Have you ever considered which games were the turning points in your gaming career? WHY NOT? This week, we reflect on ours. Plus: The \"Hypothetical Pre-Order Game,\" two grown men fight over Tom Welling, and barely a peep about Wing Commander. You're welcome. With Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik and Tim \"It's a T-Shirt!\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_54.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-54-the-games-that-made-us-hypothetical-pre-orders/"}, {"title": "GameCritics.com Podcast Episode 53: Portal 2, Dead Space 2 and Potpourri", "episode": 53, "desc": "<p>We're back! Again! Join us for captivating spoiler-free discussions of <i>Portal 2</i> and <i>Dead Space 2</i>. Plus: the merits of silent protagonists, PSN madness, Chi buys a 3DS, Mike subscribes to <i>Final Fantasy XIV</i>, Tim loses it over <i>Dante's Inferno</i>, and so much more. We were just so happy to hear each other's voices, we couldn't stop gabbing. With Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"Chance\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_53.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/sparky-clarkson/dead-space-2-review\"><i>Dead Space 2</i> Review</a></li>\n<li><a href=\"/portal-review\"><i>Portal</i> Review</a></li>\n<li><a href=\"/richard-naik/portal-2-review\"><i>Portal 2</i> Review</a></li>\n<li><a href=\"/trent-fingland/dantes-inferno-review\"><i>Dante's Inferno</i> Review</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-53-portal-2-dead-space-2-and-potpourri/"}, {"title": "GameCritics.com Podcast Episode 52: Dragon Age II and the State of Bioware", "episode": 52, "desc": "<p>You read his review: Brad hates <I>Dragon Age II</I>. But what do the rest of us think? Plus, Brad responds directly to his harshest critics, we speculate on Bioware's future, and another gripping round of Thumbs Up, Thumbs Down. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"Ewwwwwww\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_52.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/brad-gallaway/dragon-age-ii-review\"><i>Dragon Age II</i> Review</a></li>\n<li><a href=\"/brad-gallaway/dragon-age-origins-review\"><i>Dragon Age: Origins</i> Review</a></li>\n<li><a href=\"/richard-naik/dragon-age-origins-second-opinion\"><i>Dragon Age: Origins</i> Second Opinion</a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-52-dragon-age-ii-and-the-state-of-bioware/"}, {"title": "GameCritics.com Podcast Episode 51: Gaming Exchange Program II,  \u201cMiddle-Class\u201d Games", "episode": 51, "desc": "<p>We're joined by Wowhead.com Community Manager Rhea Monique for another round of our Gaming Exchange Program. This time, Tim endured <i>Team Fortress 2</i> while Richard suffered through <i>World of Warcraft</i>. You'll never guess the results! Plus, our take on The Death of Middle Class Gaming, and the coach from the Major League movies takes over Tim's hosting duties. Featuring Mike Bracken, Richard Naik, and (sort of) Tim Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_51.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedburner.com/gamecriticspodcast\" target=\"_blank\">RSS</a> </p>\n<p>Links: </p>\n<ul>\n<li><a href=\"/richard-naik/richards-guide-to-team-fortress-2-part-3-the-pyro\">Richard's Guide to <i>Team Fortress 2</i></a></li>\n</ul>\n<p>Please send feedback and mailbag questions to podcast (at) gamecritics (dot) com.</p>", "date": "", "url": "https://gamecritics.com/tim-spaeth/gamecritics-com-podcast-episode-51-gaming-exchange-program-ii-middle-class-games/"}, {"title": "GameCritics.com Podcast Episode 50: The State of Game Criticism, Dead Island Mania", "episode": 50, "desc": "<p>For our 50th episode we welcome Sam Marchello of RPGamer.com. She offers her perspective on the state of game criticism and helps us break down the mania surrounding the <i>Dead Island</i> trailer. Plus, as a special bonus: our never-before-heard \"pilot\" episode! Special thanks to RandomRob for his epic musical contribution. Featuring Chi Kong Lui, Brad Gallaway, Mike Bracken, Richard Naik, and Tim \"Podcast Angry 3D\" Spaeth.</p>\n\n<p><b>Download:</b> <a href=\"http://media.libsyn.com/media/ctpodcast/GameCritics.com_Podcast_Episode_50.mp3\" target=\"_blank\">Right click here and select \"Save Target As\u2026\"</a><br /><b>Subscribe:</b> <a href=\"http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=295924839\" target=\"_blank\">iTunes</a> | <a href=\"http://social.zune.net/podcast/GameCritics.com-Podcast/b319f3d1-c32c-4138-967f-7314ef17ea7e\" target=\"_blank\">Zune</a> | <a href=\"http://feeds.feedbur
